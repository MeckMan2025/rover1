# Person Follower Configuration for Rover2
# Configuration for human detection and following behavior

person_follower:
  ros__parameters:
    # YOLOv8 Model Configuration
    model_path: "/home/andrewmeckley/ros2_ws/src/rover2/models/yolov8s.hef"
    confidence_threshold: 0.5

    # Following Behavior Parameters (conservative ~8-10 feet following)
    target_foot_y_ratio: 0.75        # Target: feet at 75% down (safer distance ~8-10 feet)
    too_close_foot_y_ratio: 0.85     # Stop when feet at 85% (buffer before frame exit)
    center_tolerance: 0.12           # 12% of frame width deadzone for centering

    # Movement Speeds
    linear_speed: 0.6                # m/s - max forward speed
    angular_speed: 0.5               # rad/s - max rotation speed (reduced from 0.8 for stability)
    scan_angular_speed: 0.3          # rad/s - slower speed for recovery scanning

    # Angular Control Gains (PD controller for yaw tracking)
    follow_gain_yaw: 1.8             # Proportional gain for angular control (baseline: 1.6-1.9)
    follow_gain_yaw_d: 2.5           # Derivative gain for angular damping (baseline: 2.2-3.0)
    follow_gain_linear: 5.0          # Proportional gain for linear control

    # Error Filtering (prevents jitter from detection noise)
    error_filter_alpha: 0.3          # EMA filter coefficient (0=no filtering, 1=no smoothing)

    # Angular Slew Rate Limiting (prevents jerky rotation)
    max_ang_accel: 1.5               # rad/s^2 - maximum angular acceleration

    # Forward Speed Coupling to Lateral Error (prevents FOV loss during turns)
    err_slowdown: 0.35               # Lateral error threshold to start slowing forward speed
    err_turn_in_place: 0.45          # Lateral error threshold to stop and turn in place

    # Safety Timeouts
    detection_timeout: 2.0           # Stop following if person lost for 2 seconds
    teleop_override_timeout: 0.5     # How long to wait after teleop before resuming
    recovery_scan_timeout: 4.0       # Give up recovery scan after 4 seconds
    coast_timeout: 0.5               # Coast with last cmd during brief detection drops
    self_message_timeout: 0.25       # Ignore own cmd_vel echoes within this window

    # Camera Configuration
    image_topic: "/ascamera_nuwa/camera_publisher/rgb0/image"