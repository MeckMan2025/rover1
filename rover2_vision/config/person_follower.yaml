# Person Follower Configuration for Rover2
# Configuration for human detection and following behavior

person_follower:
  ros__parameters:
    # YOLOv8 Model Configuration
    model_path: "/home/andrewmeckley/ros2_ws/src/rover2/models/yolov8s.hef"
    confidence_threshold: 0.5
    
    # Following Behavior Parameters (aggressive ~6 feet following)
    target_foot_y_ratio: 0.90        # Target: feet at 90% down (very close ~6 feet)
    too_close_foot_y_ratio: 0.95     # Only stop when feet almost off-frame
    center_tolerance: 0.12           # 12% of frame width deadzone for centering

    # Movement Speeds (faster pursuit)
    linear_speed: 0.6                # m/s - faster forward speed
    angular_speed: 0.8               # rad/s - rotation speed
    
    # Safety Timeouts
    detection_timeout: 2.0           # Stop following if person lost for 2 seconds
    teleop_override_timeout: 0.5     # How long to wait after teleop before resuming
    recovery_scan_timeout: 4.0       # Give up recovery scan after 4 seconds
    
    # Camera Configuration
    image_topic: "/ascamera_nuwa/camera_publisher/rgb0/image"