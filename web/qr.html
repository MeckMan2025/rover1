<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rover · scan to drive</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100vh; width: 100vw; background: #0a0a0a; color: #eee; font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif; overflow: hidden; }
    #stage { display: flex; width: 100vw; height: 100vh; align-items: stretch; }

    #left {
      flex: 0 0 42%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 24px;
    }
    .qr-frame {
      background: #fff; padding: 22px; border-radius: 14px;
      box-shadow: 0 4px 22px rgba(0,0,0,0.5);
      display: flex; align-items: center; justify-content: center;
    }
    .qr-frame img, .qr-frame svg {
      width: clamp(200px, 28vw, 320px);
      height: clamp(200px, 28vw, 320px);
      display: block;
    }
    .label { margin-top: 22px; font-size: 22px; opacity: 0.85; letter-spacing: 0.02em; }
    .url { margin-top: 6px; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 13px; opacity: 0.55; }

    #right {
      flex: 1;
      display: flex; align-items: center; justify-content: center;
      border-left: 1px solid rgba(255,255,255,0.08);
      background: #050505;
    }
    #video,
    #video-mjpeg { max-width: 100%; max-height: 100%; object-fit: contain; }
    #video[hidden],
    #video-mjpeg[hidden] { display: none; }

    #status {
      position: fixed; bottom: 14px; left: 14px;
      background: rgba(0,0,0,0.6); padding: 8px 14px; border-radius: 8px;
      font-size: 14px; font-variant-numeric: tabular-nums;
    }
    #status .v   { color: #6f6; font-weight: 600; }
    #status .v.mid { color: #ffc107; }
    #status .v.low { color: #f66; }
    #status .sep { opacity: 0.4; margin: 0 6px; }

    /* --- Halloween skin (body.spooky, auto-on Oct 31 or ?spooky=1) --------
       Compositor-cheap only: transform/opacity animations, no filters on the
       video element, no full-screen repaint loops. */
    body.spooky { background: #0b0014; }
    body.spooky #right { background: #030008; }
    body.spooky .qr-frame {
      box-shadow: 0 0 34px rgba(255, 115, 0, 0.5), 0 4px 22px rgba(0,0,0,0.6);
    }
    body.spooky .label {
      color: #ff9d2e;
      text-shadow: 0 0 12px rgba(255, 90, 0, 0.8);
      animation: spookyFlicker 7s infinite;
    }
    body.spooky .sublabel {
      margin-top: 10px; font-size: 16px; color: #b96bff;
      text-shadow: 0 0 10px rgba(150, 60, 255, 0.7);
      letter-spacing: 0.08em;
    }
    @keyframes spookyFlicker {
      0%, 100% { opacity: 1; }
      7%  { opacity: 0.35; }
      9%  { opacity: 1; }
      54% { opacity: 1; }
      56% { opacity: 0.2; }
      57% { opacity: 1; }
      58% { opacity: 0.5; }
      60% { opacity: 1; }
    }
    #vignette {
      position: fixed; inset: 0; pointer-events: none; z-index: 5;
      background: radial-gradient(ellipse at center, transparent 52%, rgba(25, 0, 45, 0.6) 100%);
    }
    #eyes {
      position: fixed; top: 7%; right: 6%; z-index: 6; pointer-events: none;
      display: flex; gap: 26px;
      animation: eyeBlink 4.7s infinite;
      transform-origin: center;
    }
    .eye {
      width: 42px; height: 52px; border-radius: 50%;
      background: radial-gradient(circle at 50% 45%, #ffb300 0 26%, #c43000 55%, rgba(120, 10, 0, 0.35) 72%, transparent 78%);
      box-shadow: 0 0 26px 6px rgba(255, 90, 0, 0.35);
      position: relative;
    }
    .eye .pupil {
      position: absolute; left: 50%; top: 45%;
      width: 10px; height: 20px; margin: -10px 0 0 -5px;
      border-radius: 50%; background: #1a0000;
      transition: transform 0.9s ease;
    }
    @keyframes eyeBlink {
      0%, 92%, 100% { transform: scaleY(1); }
      94%, 96% { transform: scaleY(0.06); }
      98% { transform: scaleY(1); }
    }
    #flash {
      position: fixed; inset: 0; z-index: 8; pointer-events: none;
      background: rgba(255, 240, 215, 0.9); opacity: 0;
      transition: opacity 70ms linear;
    }
    #apparition {
      position: fixed; inset: 0; z-index: 9; pointer-events: none;
      display: flex; align-items: center; justify-content: center;
      font-size: clamp(40px, 8vw, 90px); font-weight: 800; letter-spacing: 0.12em;
      color: #ff1a1a; text-shadow: 0 0 30px rgba(255, 0, 0, 0.9);
      opacity: 0; transition: opacity 180ms linear;
      font-family: Georgia, "Times New Roman", serif;
    }
    #drifter {
      position: fixed; left: -90px; z-index: 6; pointer-events: none;
      font-size: 58px; opacity: 0;
    }
    #drifter.go {
      opacity: 0.9;
      transition: transform 14s linear;
      transform: translateX(118vw) rotate(8deg);
    }
    #spider {
      position: fixed; top: 0; left: 58%; z-index: 6; pointer-events: none;
      display: flex; flex-direction: column; align-items: center;
      animation: spiderBob 9s ease-in-out infinite;
    }
    #spider .thread { width: 1px; height: 90px; background: rgba(255,255,255,0.35); }
    #spider .bug { font-size: 30px; margin-top: -4px; }
    @keyframes spiderBob {
      0%, 100% { transform: translateY(-12px); }
      50% { transform: translateY(34px); }
    }
  </style>
</head>
<body>
  <div id="stage">
    <div id="left">
      <div class="qr-frame">
        <img src="/qr.svg" alt="scan to drive">
      </div>
      <div class="label">scan to drive</div>
      <div class="url">__URL__</div>
    </div>
    <div id="right">
      <video id="video" autoplay muted playsinline></video>
      <img id="video-mjpeg" alt="rover camera" hidden>
    </div>
  </div>

  <div id="status">
    <span class="v" id="bat">— V</span>
    <span class="sep">·</span><span id="fps">— fps</span>
    <span class="sep">·</span>gain <span id="gain">—</span>
    <span class="sep">·</span><span class="v" id="temp">— °C</span>
  </div>

<script>
(() => {
  // --- Video stream (H.264/fMP4 over WS, MJPEG fallback) ------------------
  // Same logic as index.html, trimmed for the kiosk's read-only view.
  const video = document.getElementById("video");
  const videoMjpeg = document.getElementById("video-mjpeg");
  const H264_MIME = 'video/mp4; codecs="avc1.42E01F"';
  const forced = new URLSearchParams(location.search).get("stream");
  let videoMode = null;
  let videoSocket = null;
  let mediaSource = null;
  let sourceBuffer = null;
  let pending = [];
  let appending = false;
  let reconnectTimer = null;

  function mseSupportsH264() {
    return !!window.MediaSource && MediaSource.isTypeSupported(H264_MIME);
  }
  function pickMode() {
    if (forced === "mjpeg" || forced === "h264") return forced;
    return mseSupportsH264() ? "h264" : "mjpeg";
  }
  function showH264()  { video.hidden = false; videoMjpeg.hidden = true;  videoMjpeg.removeAttribute("src"); }
  function showMjpeg() { video.hidden = true;  videoMjpeg.hidden = false; videoMjpeg.src = "/video.mjpg?t=" + Date.now(); }
  function tearDown() {
    try { if (videoSocket) videoSocket.close(); } catch (_) {}
    videoSocket = null;
    try { if (mediaSource && mediaSource.readyState === "open") mediaSource.endOfStream(); } catch (_) {}
    mediaSource = null; sourceBuffer = null;
    pending = []; appending = false;
    if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
  }
  function pump() {
    if (appending || !sourceBuffer || sourceBuffer.updating || pending.length === 0) return;
    const chunk = pending.shift();
    appending = true;
    try { sourceBuffer.appendBuffer(chunk); }
    catch (e) {
      appending = false;
      if (e.name === "QuotaExceededError") {
        try {
          const buf = sourceBuffer.buffered;
          if (buf.length > 0) sourceBuffer.remove(0, Math.max(0, buf.end(buf.length-1) - 2));
        } catch (_) {}
        pending.unshift(chunk);
      } else { console.warn("MSE:", e); scheduleReconnect(); }
    }
  }
  function openSocket() {
    const scheme = location.protocol === "https:" ? "wss" : "ws";
    videoSocket = new WebSocket(`${scheme}://${location.host}/ws/video`);
    videoSocket.binaryType = "arraybuffer";
    videoSocket.onmessage = (ev) => { pending.push(new Uint8Array(ev.data)); pump(); };
    videoSocket.onclose = (ev) => {
      if (ev.code === 1011 && /ffmpeg/i.test(ev.reason || "")) {
        console.warn("ffmpeg missing on rover; falling back to MJPEG");
        videoMode = "mjpeg"; tearDown(); showMjpeg(); return;
      }
      scheduleReconnect();
    };
    videoSocket.onerror = (e) => console.warn("video WS:", e);
  }
  function scheduleReconnect() {
    if (reconnectTimer || videoMode !== "h264") return;
    reconnectTimer = setTimeout(() => { reconnectTimer = null; if (videoMode === "h264") startH264(); }, 1500);
  }
  function startH264() {
    videoMode = "h264"; showH264(); tearDown();
    mediaSource = new MediaSource();
    video.src = URL.createObjectURL(mediaSource);
    mediaSource.addEventListener("sourceopen", () => {
      try { URL.revokeObjectURL(video.src); } catch (_) {}
      try { sourceBuffer = mediaSource.addSourceBuffer(H264_MIME); }
      catch (e) { console.warn("addSourceBuffer:", e); videoMode = "mjpeg"; tearDown(); showMjpeg(); return; }
      sourceBuffer.mode = "sequence";
      sourceBuffer.addEventListener("updateend", () => { appending = false; pump(); });
      openSocket();
    }, { once: true });
  }

  if (pickMode() === "h264") startH264();
  else { videoMode = "mjpeg"; showMjpeg(); }

  // --- Halloween skin ------------------------------------------------------
  // Auto-on only on Oct 31 (device-local time); force with ?spooky=1,
  // suppress with ?nospooky=1. Self-reverting: Nov 1 the page is normal again.
  (() => {
    const q = new URLSearchParams(location.search);
    const today = new Date();
    const isHalloween = today.getMonth() === 9 && today.getDate() === 31;
    if (q.has("nospooky") || (!q.has("spooky") && !isHalloween)) return;

    document.body.classList.add("spooky");
    document.title = "Thing · scan if you dare";
    document.querySelector(".label").textContent = "scan… if you dare";
    const sub = document.createElement("div");
    sub.className = "sublabel";
    sub.textContent = "🖐️ THING is watching";
    document.querySelector(".url").before(sub);

    const el = (id, html) => {
      const d = document.createElement("div");
      d.id = id; d.innerHTML = html;
      document.body.appendChild(d);
      return d;
    };
    el("vignette", "");
    const eyes = el("eyes",
      '<div class="eye"><div class="pupil"></div></div>' +
      '<div class="eye"><div class="pupil"></div></div>');
    el("spider", '<div class="thread"></div><div class="bug">🕷️</div>');
    const flash = el("flash", "");
    const apparition = el("apparition", "THING SEES YOU");
    const drifter = el("drifter", "👻");

    const rand = (lo, hi) => lo + Math.random() * (hi - lo);

    // Pupils wander every few seconds.
    (function wander() {
      const x = rand(-9, 9).toFixed(1), y = rand(-7, 7).toFixed(1);
      for (const p of eyes.querySelectorAll(".pupil"))
        p.style.transform = `translate(${x}px, ${y}px)`;
      setTimeout(wander, rand(1800, 4500));
    })();

    // Double lightning flash every 25-50 s; 1-in-4 flashes reveal the message.
    (function lightning() {
      const reveal = Math.random() < 0.25;
      flash.style.opacity = "0.85";
      setTimeout(() => { flash.style.opacity = "0"; }, 90);
      setTimeout(() => { flash.style.opacity = "0.6"; }, 220);
      setTimeout(() => { flash.style.opacity = "0"; }, 310);
      if (reveal) {
        apparition.style.opacity = "1";
        setTimeout(() => { apparition.style.opacity = "0"; }, 1100);
      }
      setTimeout(lightning, rand(25000, 50000));
    })();

    // A ghost or bat drifts across every 40-80 s.
    (function drift() {
      drifter.textContent = Math.random() < 0.5 ? "👻" : "🦇";
      drifter.style.top = rand(8, 65).toFixed(0) + "%";
      drifter.classList.add("go");
      setTimeout(() => {
        drifter.classList.remove("go");
        drifter.style.transition = "none";
        drifter.style.transform = "none";
        // force reflow so the next .go transition starts from the left again
        void drifter.offsetWidth;
        drifter.style.transition = "";
      }, 15000);
      setTimeout(drift, rand(40000, 80000));
    })();
  })();

  // --- Telemetry poll -----------------------------------------------------
  (async function pollTelemetry() {
    const bat  = document.getElementById("bat");
    const fps  = document.getElementById("fps");
    const gain = document.getElementById("gain");
    const temp = document.getElementById("temp");
    let lastDisplayCount = null;
    while (true) {
      try {
        const r = await fetch("/telemetry");
        if (r.ok) {
          const j = await r.json();
          if (j.battery_v != null) {
            bat.textContent = j.battery_v.toFixed(2) + " V";
            bat.classList.remove("mid", "low");
            if      (j.battery_v < 12.5) bat.classList.add("low");
            else if (j.battery_v < 13.0) bat.classList.add("mid");
          }
          if (j.camera_fps  != null) fps.textContent  = j.camera_fps.toFixed(1) + " fps";
          if (j.camera_gain != null) gain.textContent = j.camera_gain.toFixed(1) + "×";
          if (j.cpu_temp_c != null) {
            temp.textContent = j.cpu_temp_c.toFixed(0) + " °C";
            temp.classList.remove("mid", "low");
            if      (j.cpu_temp_c >= 78) temp.classList.add("low");
            else if (j.cpu_temp_c >= 70) temp.classList.add("mid");
          }
          // When the kiosk's HDMI comes back on, any in-flight stream is
          // toast — chromium doesn't auto-reconnect. Server bumps
          // display_on_count on every off→on transition; we restart the
          // currently-active stream path.
          if (j.display_on_count != null) {
            if (lastDisplayCount !== null && j.display_on_count !== lastDisplayCount) {
              if (videoMode === "h264") startH264();
              else                       showMjpeg();
            }
            lastDisplayCount = j.display_on_count;
          }
        }
      } catch (_) {}
      await new Promise(r => setTimeout(r, 1000));
    }
  })();
})();
</script>
</body>
</html>
