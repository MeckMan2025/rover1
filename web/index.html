<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Rover</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      margin: 0;
      padding: 0;
      height: 100vh;
      width: 100vw;
      background: #0a0a0a;
      color: #eee;
      font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      overflow: hidden;
    }
    #stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #video {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    #status {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(0, 0, 0, 0.55);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 14px;
      font-variant-numeric: tabular-nums;
      pointer-events: none;
    }
    #status .v { color: #6f6; font-weight: 600; }
    #status .v.low { color: #f66; }
    #status .sep { opacity: 0.4; margin: 0 6px; }
    #estop {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 76px;
      height: 76px;
      border-radius: 50%;
      border: 3px solid #f33;
      background: #511;
      color: #f99;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.1s, color 0.1s;
    }
    #estop:active {
      background: #f33;
      color: #fff;
    }
    #joystick {
      position: absolute;
      bottom: 40px;
      right: 40px;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.06);
      border: 2px solid rgba(255, 255, 255, 0.18);
      touch-action: none;
    }
    #knob {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.45);
      border: 2px solid rgba(255, 255, 255, 0.75);
      transform: translate(-50%, -50%);
      pointer-events: none;
      transition: transform 0.06s linear;
    }
    #ws-state {
      position: absolute;
      bottom: 14px;
      left: 14px;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.55);
    }
    #ws-state.ok { color: #6f6; }
    #ws-state.bad { color: #f66; }
    #hint {
      position: absolute;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      color: rgba(255, 255, 255, 0.4);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="stage">
    <img id="video" src="/video.mjpg" alt="rover camera">
    <div id="status">
      <span class="v" id="bat">— V</span>
      <span class="sep">·</span>
      <span id="fps">— fps</span>
    </div>
    <button id="estop">E-STOP</button>
    <div id="joystick">
      <div id="knob"></div>
    </div>
    <div id="ws-state" class="bad">disconnected</div>
    <div id="hint">↑ forward &nbsp;·&nbsp; → turn right</div>
  </div>

<script>
(() => {
  const wsState = document.getElementById("ws-state");
  const knob    = document.getElementById("knob");
  const stick   = document.getElementById("joystick");
  const estop   = document.getElementById("estop");
  const bat     = document.getElementById("bat");
  const fps     = document.getElementById("fps");

  let ws = null;
  let wsReady = false;
  let drive = { vx: 0, omega: 0 };

  function connect() {
    ws = new WebSocket(`ws://${location.host}/ws`);
    ws.onopen  = () => { wsReady = true;  wsState.textContent = "connected";    wsState.className = "ok";  };
    ws.onclose = () => { wsReady = false; wsState.textContent = "reconnecting…"; wsState.className = "bad"; setTimeout(connect, 1000); };
    ws.onerror = () => { try { ws.close(); } catch (e) {} };
  }
  connect();

  // Joystick: pointer position -> normalized (vx, omega)
  function rect() { return stick.getBoundingClientRect(); }
  function halfSize() { return rect().width / 2; }

  function setFromPointer(clientX, clientY) {
    const r = rect();
    const dx = clientX - (r.left + r.width  / 2);
    const dy = clientY - (r.top  + r.height / 2);
    const max = halfSize();
    const xN = Math.max(-1, Math.min(1, dx / max));
    const yN = Math.max(-1, Math.min(1, dy / max));
    // Screen up = forward (vx +). Screen right = clockwise turn (omega - in ROS).
    drive = { vx: -yN, omega: -xN };
    moveKnob(xN, yN);
  }

  function moveKnob(xN, yN) {
    const offset = halfSize() - 35;  // 35 = knob radius
    knob.style.transform = `translate(calc(-50% + ${xN * offset}px), calc(-50% + ${yN * offset}px))`;
  }

  let activeId = null;
  stick.addEventListener("pointerdown", (e) => {
    if (activeId !== null) return;
    activeId = e.pointerId;
    stick.setPointerCapture(e.pointerId);
    setFromPointer(e.clientX, e.clientY);
  });
  stick.addEventListener("pointermove", (e) => {
    if (e.pointerId !== activeId) return;
    setFromPointer(e.clientX, e.clientY);
  });
  function release(e) {
    if (e.pointerId !== activeId) return;
    activeId = null;
    drive = { vx: 0, omega: 0 };
    moveKnob(0, 0);
  }
  stick.addEventListener("pointerup",     release);
  stick.addEventListener("pointercancel", release);
  stick.addEventListener("pointerleave",  release);

  estop.addEventListener("click", () => {
    if (wsReady) ws.send(JSON.stringify({ type: "estop" }));
  });

  // 20 Hz drive tick — sends current joystick state regardless of motion,
  // so the server-side watchdog stays happy while the user is connected.
  setInterval(() => {
    if (wsReady) {
      ws.send(JSON.stringify({ type: "drive", vx: drive.vx, vy: 0, omega: drive.omega }));
    }
  }, 50);

  // 2 Hz telemetry poll
  async function pollTelemetry() {
    try {
      const r = await fetch("/telemetry");
      if (r.ok) {
        const j = await r.json();
        if (j.battery_v != null) {
          bat.textContent = j.battery_v.toFixed(2) + " V";
          bat.classList.toggle("low", j.battery_v < 11.0);
        }
        if (j.camera_fps != null) {
          fps.textContent = j.camera_fps.toFixed(1) + " fps";
        }
      }
    } catch (e) { /* ignore — retry next tick */ }
    setTimeout(pollTelemetry, 500);
  }
  pollTelemetry();
})();
</script>
</body>
</html>
