<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Rover</title>
  <style>
    *  { box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; height: 100vh; width: 100vw; background: #0a0a0a; color: #eee; font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif; overflow: hidden; }

    #stage { position: relative; width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
    #video { max-width: 100%; max-height: 100%; object-fit: contain; }

    /* Status (top-left) */
    #status {
      position: absolute; top: 12px; left: 12px;
      background: rgba(0,0,0,0.55); padding: 8px 12px; border-radius: 8px;
      font-size: 14px; font-variant-numeric: tabular-nums; pointer-events: none;
    }
    #status .v   { color: #6f6; font-weight: 600; }
    #status .v.mid { color: #ffc107; }
    #status .v.low { color: #f66; }
    #status .sep { opacity: 0.4; margin: 0 6px; }

    /* Speed slider — stacks directly under the status row in the top-left
       so it never overlaps the battery readout. */
    #power-box {
      position: absolute; top: 52px; left: 12px;
      background: rgba(0,0,0,0.55); padding: 8px 14px; border-radius: 8px;
      font-size: 13px; font-variant-numeric: tabular-nums;
      display: flex; align-items: center; gap: 10px;
    }
    #power-box label { opacity: 0.75; letter-spacing: 0.04em; text-transform: uppercase; font-size: 11px; }
    #power-slider {
      -webkit-appearance: none; appearance: none;
      width: 150px; height: 6px;
      background: linear-gradient(to right, #f66 0%, #ffc107 40%, #6f6 70%);
      border-radius: 6px; outline: none; cursor: pointer; touch-action: none;
    }
    #power-slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 22px; height: 22px; border-radius: 50%; background: #eee; border: 2px solid #444; cursor: pointer; }
    #power-slider::-moz-range-thumb     { width: 22px; height: 22px; border-radius: 50%; background: #eee; border: 2px solid #444; cursor: pointer; }
    #power-value { min-width: 42px; text-align: right; font-weight: 600; color: #6f6; }
    #power-value.mid { color: #ffc107; }
    #power-value.low { color: #f66; }

    /* Right-side button column ----------------------------------------------*/
    .right-btn {
      position: absolute; right: 12px;
      border-radius: 12px; font-weight: bold; cursor: pointer;
      transition: background 0.1s, color 0.1s, border-color 0.1s;
    }
    #estop {
      top: 12px; width: 76px; height: 76px; border-radius: 50%;
      border: 3px solid #f33; background: #511; color: #f99; font-size: 13px;
    }
    #estop:active { background: #f33; color: #fff; }

    #screen-toggle {
      top: 100px; width: 76px; height: 76px;
      border: 2px solid rgba(255,255,255,0.3);
      background: rgba(60,60,60,0.5); color: #ddd; font-size: 11px;
    }
    #screen-toggle.off { background: rgba(80,40,40,0.5); color: #f99; border-color: rgba(255,100,100,0.4); }

    #reboot-btn {
      top: 190px; width: 76px; height: 52px;
      border: 2px solid rgba(120,160,255,0.4);
      background: rgba(40,55,90,0.5); color: #abf; font-size: 11px;
    }
    #reboot-btn:active { background: rgba(60,90,160,0.6); color: #fff; }

    #poweroff-btn {
      top: 254px; width: 76px; height: 52px;
      border: 2px solid rgba(255,255,255,0.2);
      background: rgba(40,40,40,0.5); color: #aaa; font-size: 11px;
    }
    #poweroff-btn:active { background: rgba(80,80,80,0.6); color: #fff; }

    /* Joysticks (bottom corners) */
    .joystick {
      position: absolute; bottom: 24px; width: 180px; height: 180px;
      border-radius: 50%; background: rgba(255,255,255,0.06);
      border: 2px solid rgba(255,255,255,0.18); touch-action: none;
    }
    #joystickLeft  { left: 24px; }
    #joystickRight { right: 24px; }
    .knob {
      position: absolute; top: 50%; left: 50%; width: 70px; height: 70px;
      border-radius: 50%; background: rgba(255,255,255,0.45);
      border: 2px solid rgba(255,255,255,0.75);
      transform: translate(-50%, -50%); pointer-events: none;
      transition: transform 0.06s linear;
    }
    .joy-label { position: absolute; left: 50%; transform: translateX(-50%); bottom: -22px; font-size: 11px; color: rgba(255,255,255,0.65); letter-spacing: 0.05em; text-transform: uppercase; pointer-events: none; white-space: nowrap; }

    #ws-state {
      position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
      font-size: 12px; padding: 4px 10px; border-radius: 4px;
      background: rgba(0,0,0,0.55); pointer-events: none;
    }
    #ws-state.ok  { color: #6f6; }
    #ws-state.bad { color: #f66; }

    @media (max-width: 600px) {
      .joystick { width: 130px; height: 130px; bottom: 20px; }
      .knob { width: 52px; height: 52px; }
      #joystickLeft  { left: 16px; }
      #joystickRight { right: 16px; }
      #power-slider  { width: 110px; }
      #estop         { width: 70px; height: 70px; }
      #screen-toggle { top: 90px;  width: 70px; height: 70px; }
      #reboot-btn    { top: 170px; width: 70px; height: 46px; }
      #poweroff-btn  { top: 224px; width: 70px; height: 46px; }
    }
  </style>
</head>
<body>
  <div id="stage">
    <img id="video" src="/video.mjpg" alt="rover camera">

    <div id="status">
      <span class="v" id="bat">— V</span>
      <span class="sep">·</span><span id="fps">— fps</span>
      <span class="sep">·</span>gain <span id="gain">—</span>
    </div>

    <div id="power-box">
      <label for="power-slider">Speed</label>
      <input id="power-slider" type="range" min="10" max="100" step="5" value="100">
      <span id="power-value">100%</span>
    </div>

    <button id="estop"          class="right-btn">E-STOP</button>
    <button id="screen-toggle"  class="right-btn" title="Toggle rover touchscreen">TURN<br>OFF</button>
    <button id="reboot-btn"     class="right-btn">REBOOT</button>
    <button id="poweroff-btn"   class="right-btn">POWER<br>OFF</button>

    <div id="joystickLeft"  class="joystick"><div id="knobLeft"  class="knob"></div><div class="joy-label">drive · turn</div></div>
    <div id="joystickRight" class="joystick"><div id="knobRight" class="knob"></div><div class="joy-label">strafe</div></div>

    <div id="ws-state" class="bad">disconnected</div>
  </div>

<script>
(() => {
  // --- WebSocket -----------------------------------------------------------
  const wsState = document.getElementById("ws-state");
  let ws = null;
  let wsReady = false;

  function send(msg) { if (wsReady) ws.send(JSON.stringify(msg)); }

  function connect() {
    ws = new WebSocket(`ws://${location.host}/ws`);
    ws.onopen  = () => {
      wsReady = true;
      wsState.textContent = "connected"; wsState.className = "ok";
      send({ type: "set_power", value: powerValue() / 100 });
    };
    ws.onclose = () => { wsReady = false; wsState.textContent = "reconnecting…"; wsState.className = "bad"; setTimeout(connect, 1000); };
    ws.onerror = () => { try { ws.close(); } catch (e) {} };
  }

  // --- Joystick ------------------------------------------------------------
  class Joystick {
    constructor(elementId, knobId) {
      this.element = document.getElementById(elementId);
      this.knob    = document.getElementById(knobId);
      this.x = 0; this.y = 0; this.activeId = null;
      this.element.addEventListener("pointerdown",  e => this._down(e));
      this.element.addEventListener("pointermove",  e => this._move(e));
      this.element.addEventListener("pointerup",     e => this._up(e));
      this.element.addEventListener("pointercancel", e => this._up(e));
      this.element.addEventListener("pointerleave",  e => this._up(e));
    }
    _half() { return this.element.getBoundingClientRect().width / 2; }
    _set(cx, cy) {
      const r = this.element.getBoundingClientRect();
      const dx = cx - (r.left + r.width / 2);
      const dy = cy - (r.top + r.height / 2);
      const m = this._half();
      this.x = Math.max(-1, Math.min(1, dx / m));
      this.y = Math.max(-1, Math.min(1, dy / m));
      this._drawKnob();
    }
    _reset() { this.x = 0; this.y = 0; this._drawKnob(); }
    _drawKnob() {
      const offset = this._half() - (this.knob.offsetWidth / 2);
      this.knob.style.transform = `translate(calc(-50% + ${this.x * offset}px), calc(-50% + ${this.y * offset}px))`;
    }
    _down(e) { if (this.activeId !== null) return; this.activeId = e.pointerId; this.element.setPointerCapture(e.pointerId); this._set(e.clientX, e.clientY); }
    _move(e) { if (e.pointerId === this.activeId) this._set(e.clientX, e.clientY); }
    _up(e)   {
      if (e.pointerId !== this.activeId) return;
      this.activeId = null;
      this._reset();
      // Send a drive packet immediately on release instead of waiting up to
      // 50 ms for the next setInterval tick. Cuts post-release coast almost
      // entirely on a buffered link; the OS often flushes an explicit send()
      // sooner than a periodic one.
      sendDriveNow();
    }
  }
  const left  = new Joystick("joystickLeft",  "knobLeft");
  const right = new Joystick("joystickRight", "knobRight");

  function drive() {
    return { vx: -left.y, vy: -right.x, omega: -left.x };
  }

  // Send the current drive state immediately. Called by the 20 Hz tick
  // and also by Joystick._up() on release for a faster stop response.
  function sendDriveNow() {
    if (!wsReady) return;
    const d = drive();
    ws.send(JSON.stringify({ type: "drive", vx: d.vx, vy: d.vy, omega: d.omega }));
  }

  // --- Power slider --------------------------------------------------------
  const slider = document.getElementById("power-slider");
  const sliderValueEl = document.getElementById("power-value");
  function powerValue() { return parseInt(slider.value, 10); }
  function reflectPower() {
    const v = powerValue();
    sliderValueEl.textContent = v + "%";
    sliderValueEl.classList.toggle("mid", v < 70 && v >= 40);
    sliderValueEl.classList.toggle("low", v < 40);
  }
  const savedPower = parseInt(localStorage.getItem("rover_power") || "100", 10);
  slider.value = Math.max(10, Math.min(100, savedPower || 100));
  reflectPower();
  let powerSendTimer = null;
  slider.addEventListener("input", () => {
    reflectPower();
    localStorage.setItem("rover_power", String(powerValue()));
    clearTimeout(powerSendTimer);
    powerSendTimer = setTimeout(() => send({ type: "set_power", value: powerValue() / 100 }), 80);
  });

  // --- Screen toggle -------------------------------------------------------
  const screenBtn = document.getElementById("screen-toggle");
  let screenOn = true;
  function reflectScreen() {
    // Label by action ("what tap will do"), color by state (red = off).
    screenBtn.innerHTML = screenOn ? "TURN<br>OFF" : "TURN<br>ON";
    screenBtn.classList.toggle("off", !screenOn);
  }
  reflectScreen();
  screenBtn.addEventListener("click", () => {
    screenOn = !screenOn;
    reflectScreen();
    send({ type: "set_display", on: screenOn });
  });

  // --- Reboot / Power off (confirm before firing) --------------------------
  document.getElementById("reboot-btn").addEventListener("click", () => {
    if (confirm("Reboot the rover? It'll come back in about 30 seconds.")) {
      send({ type: "shutdown", action: "reboot" });
    }
  });
  document.getElementById("poweroff-btn").addEventListener("click", () => {
    if (confirm("Power off the rover? You'll need to power it back on manually.")) {
      send({ type: "shutdown", action: "poweroff" });
    }
  });

  // --- E-stop --------------------------------------------------------------
  document.getElementById("estop").addEventListener("click", () => send({ type: "estop" }));

  // --- Ticks ---------------------------------------------------------------
  connect();
  setInterval(sendDriveNow, 50);

  const bat  = document.getElementById("bat");
  const fps  = document.getElementById("fps");
  const gain = document.getElementById("gain");
  async function pollTelemetry() {
    try {
      const r = await fetch("/telemetry");
      if (r.ok) {
        const j = await r.json();
        if (j.battery_v != null) {
          bat.textContent = j.battery_v.toFixed(2) + " V";
          bat.classList.remove("mid", "low");
          // Tuned for the rover's CYCLENBATT 12V 10Ah LiFePO4 pack.
          // LiFePO4 has a very flat discharge curve — almost all useful
          // capacity sits between 13.0V (50% SOC) and 12.5V (20% SOC).
          // BMS cutoff is ~10V, so red has to fire well before that.
          //   green  ≥ 13.0V  (>50% SOC)
          //   amber  12.5–13.0V (20–50% SOC, charge when convenient)
          //   red    <  12.5V  (<20% SOC, charge soon)
          if      (j.battery_v < 12.5) bat.classList.add("low");
          else if (j.battery_v < 13.0) bat.classList.add("mid");
        }
        if (j.camera_fps  != null) { fps.textContent  = j.camera_fps.toFixed(1) + " fps"; }
        if (j.camera_gain != null) { gain.textContent = j.camera_gain.toFixed(1) + "×"; }
      }
    } catch (_) {}
    setTimeout(pollTelemetry, 500);
  }
  pollTelemetry();
})();
</script>
</body>
</html>
