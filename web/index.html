<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Rover</title>
  <style>
    *  { box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0;
      height: 100vh;
      height: 100dvh;
      width: 100vw;
      background: #0a0a0a; color: #eee;
      font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      overflow: hidden;
    }
    :root {
      --safe-top:    env(safe-area-inset-top,    0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    #stage { position: relative; width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
    #video,
    #video-mjpeg { max-width: 100%; max-height: 100%; object-fit: contain; }
    /* Hide whichever element is inactive. The other one fills the stage. */
    #video[hidden],
    #video-mjpeg[hidden] { display: none; }

    /* Dog bbox overlay — absolutely positioned over the video by JS, updated
       at telemetry poll rate (2 Hz). Hidden until a dog is detected. */
    #bbox-overlay {
      position: absolute; pointer-events: none;
      border: 3px solid #6f6;
      box-shadow: 0 0 10px rgba(120, 255, 120, 0.6), inset 0 0 4px rgba(120, 255, 120, 0.3);
      border-radius: 2px;
      display: none;
      transition: left 0.15s linear, top 0.15s linear, width 0.15s linear, height 0.15s linear;
    }
    #bbox-overlay.too-close { border-color: #f66; box-shadow: 0 0 10px rgba(255, 100, 100, 0.6); }
    #bbox-label {
      position: absolute; top: -22px; left: -2px;
      background: rgba(0,0,0,0.7); color: #6f6;
      padding: 2px 6px; border-radius: 3px;
      font-size: 11px; font-weight: 600; letter-spacing: 0.02em;
      white-space: nowrap;
    }
    #bbox-overlay.too-close #bbox-label { color: #f66; }

    /* Status (top-left) */
    #status {
      position: absolute; top: calc(12px + var(--safe-top)); left: 12px;
      background: rgba(0,0,0,0.55); padding: 8px 12px; border-radius: 8px;
      font-size: 14px; font-variant-numeric: tabular-nums; pointer-events: none;
    }
    #status .v   { color: #6f6; font-weight: 600; }
    #status .v.mid { color: #ffc107; }
    #status .v.low { color: #f66; }
    #status .sep { opacity: 0.4; margin: 0 6px; }

    /* Speed slider */
    #power-box {
      position: absolute; top: calc(52px + var(--safe-top)); left: 12px;
      background: rgba(0,0,0,0.55); padding: 8px 14px; border-radius: 8px;
      font-size: 13px; font-variant-numeric: tabular-nums;
      display: flex; align-items: center; gap: 10px;
    }
    #power-box label { opacity: 0.75; letter-spacing: 0.04em; text-transform: uppercase; font-size: 11px; }
    #power-slider {
      -webkit-appearance: none; appearance: none;
      width: 150px; height: 6px;
      background: linear-gradient(to right, #f66 0%, #ffc107 40%, #6f6 70%);
      border-radius: 6px; outline: none; cursor: pointer; touch-action: none;
    }
    #power-slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 22px; height: 22px; border-radius: 50%; background: #eee; border: 2px solid #444; cursor: pointer; }
    #power-slider::-moz-range-thumb     { width: 22px; height: 22px; border-radius: 50%; background: #eee; border: 2px solid #444; cursor: pointer; }
    #power-value { min-width: 42px; text-align: right; font-weight: 600; color: #6f6; }
    #power-value.mid { color: #ffc107; }
    #power-value.low { color: #f66; }

    /* Utility row */
    #util-row {
      position: absolute; top: calc(100px + var(--safe-top)); left: 12px;
      display: flex; gap: 6px;
    }
    .util-btn {
      width: 70px; height: 34px;
      border-radius: 6px;
      font-size: 11px; font-weight: bold;
      cursor: pointer; letter-spacing: 0.03em;
      transition: background 0.1s, color 0.1s, border-color 0.1s;
    }
    #reboot-btn {
      border: 1.5px solid rgba(120,160,255,0.4);
      background: rgba(40,55,90,0.6); color: #abf;
    }
    #reboot-btn:active { background: rgba(60,90,160,0.7); color: #fff; }
    #poweroff-btn {
      border: 1.5px solid rgba(255,255,255,0.2);
      background: rgba(40,40,40,0.6); color: #aaa;
    }
    #poweroff-btn:active { background: rgba(80,80,80,0.7); color: #fff; }
    /* FOLLOW gets bigger color treatment because it's the magic button. */
    #follow-btn {
      border: 1.5px solid rgba(120,200,120,0.45);
      background: rgba(40,80,40,0.6); color: #cfc;
    }
    #follow-btn:active { background: rgba(60,140,60,0.75); color: #fff; }
    #follow-btn.tracking  { background: rgba(60,150,60,0.75);  color: #fff; border-color: #6f6; }
    #follow-btn.searching { background: rgba(120,90,30,0.7);   color: #ffd; border-color: #ffc107; }
    #follow-btn.too-close { background: rgba(150,60,60,0.75);  color: #fff; border-color: #f66; }
    #follow-btn.initializing { background: rgba(60,80,140,0.7); color: #cdf; border-color: #abf; }

    /* Right-side safety column */
    .right-btn {
      position: absolute; right: 12px;
      border-radius: 12px; font-weight: bold; cursor: pointer;
      transition: background 0.1s, color 0.1s, border-color 0.1s;
    }
    #estop {
      top: calc(12px + var(--safe-top)); width: 76px; height: 76px; border-radius: 50%;
      border: 3px solid #f33; background: #511; color: #f99; font-size: 13px;
    }
    #estop:active { background: #f33; color: #fff; }
    #screen-toggle {
      top: calc(100px + var(--safe-top)); width: 76px; height: 76px;
      border: 2px solid rgba(255,255,255,0.3);
      background: rgba(60,60,60,0.5); color: #ddd; font-size: 11px;
    }
    #screen-toggle.off { background: rgba(80,40,40,0.5); color: #f99; border-color: rgba(255,100,100,0.4); }

    /* D-pad and strafe pad */
    #dpad {
      position: absolute; left: 24px;
      bottom: calc(80px + var(--safe-bottom));
      width: 200px; height: 200px;
    }
    #strafe-pad {
      position: absolute; right: 24px;
      bottom: calc(80px + var(--safe-bottom));
      width: 144px; height: 64px;
    }
    .action-btn {
      position: absolute;
      width: 64px; height: 64px;
      border-radius: 14px;
      border: 2px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.06);
      color: rgba(255,255,255,0.8);
      font-size: 28px; font-weight: bold;
      cursor: pointer; touch-action: none;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.04s linear, border-color 0.04s linear;
    }
    .action-btn.active {
      background: rgba(120, 200, 120, 0.35);
      border-color: rgba(180, 255, 180, 0.7);
      color: #fff;
    }
    #btn-forward      { top: 0;    left: 68px; }
    #btn-rotate-left  { top: 68px; left: 0; }
    #btn-rotate-right { top: 68px; left: 136px; }
    #btn-backward     { top: 136px;left: 68px; }
    #btn-strafe-left  { left: 0; top: 0; }
    #btn-strafe-right { left: 80px; top: 0; }
    .pad-label {
      position: absolute; bottom: -20px; left: 0; right: 0;
      text-align: center; font-size: 10px; letter-spacing: 0.08em;
      text-transform: uppercase; color: rgba(255,255,255,0.45);
      pointer-events: none;
    }

    #ws-state {
      position: absolute; left: 50%; transform: translateX(-50%);
      bottom: calc(56px + var(--safe-bottom));
      font-size: 12px; padding: 4px 10px; border-radius: 4px;
      background: rgba(0,0,0,0.55); pointer-events: none;
    }
    #ws-state.ok  { color: #6f6; }
    #ws-state.bad { color: #f66; }

    /* Mode toggle (LAN / Cellular) — top center */
    #mode-toggle {
      position: absolute; top: calc(12px + var(--safe-top)); left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.55); border-radius: 8px;
      padding: 3px; display: flex; gap: 0;
      font-size: 11px;
    }
    .mode-btn {
      background: transparent; border: none;
      color: #aaa; padding: 6px 12px; border-radius: 6px;
      font-weight: 700; letter-spacing: 0.06em;
      cursor: pointer; transition: background 0.1s, color 0.1s;
    }
    .mode-btn.active { background: rgba(255,255,255,0.18); color: #fff; }
    #mode-hint {
      position: absolute; top: calc(46px + var(--safe-top)); left: 50%;
      transform: translateX(-50%);
      white-space: nowrap; font-size: 10px; letter-spacing: 0.04em;
      opacity: 0.55; pointer-events: none;
    }

    /* Snapshot panel covers the camera area when in Cellular mode.
       pointer-events: none so the underlying D-pad / strafe / status keep
       working; only the snapshot button itself opts back in. */
    #snapshot-panel {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
      background: #0a0a0a;
      pointer-events: none;
    }
    #snapshot-panel[hidden] { display: none; }
    #snapshot { max-width: 92%; max-height: 56%; object-fit: contain; display: none; }
    #snapshot.has-image { display: block; }
    #snapshot-empty { color: #666; font-size: 13px; letter-spacing: 0.04em; }
    #snapshot-empty.hidden { display: none; }
    #snapshot-controls {
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      pointer-events: auto;
    }
    #snapshot-btn {
      padding: 12px 28px; border-radius: 12px;
      background: rgba(60,80,140,0.75); border: 2px solid rgba(120,160,255,0.55);
      color: #fff; font-size: 15px; font-weight: 700; letter-spacing: 0.05em;
      cursor: pointer;
    }
    #snapshot-btn:active   { background: rgba(80,110,180,0.9); }
    #snapshot-btn:disabled { opacity: 0.5; cursor: default; }
    #snapshot-meta {
      font-size: 12px; color: #aaa; font-variant-numeric: tabular-nums;
    }
    #snapshot-meta .sep { opacity: 0.4; margin: 0 6px; }

    @media (max-width: 600px) {
      #dpad       { width: 168px; height: 168px; left: 16px; }
      #strafe-pad { width: 120px; height: 56px;  right: 16px; }
      .action-btn { width: 56px; height: 56px; font-size: 24px; border-radius: 12px; }
      #btn-forward      { top: 0;     left: 56px; }
      #btn-rotate-left  { top: 56px;  left: 0; }
      #btn-rotate-right { top: 56px;  left: 112px; }
      #btn-backward     { top: 112px; left: 56px; }
      #btn-strafe-left  { left: 0; }
      #btn-strafe-right { left: 64px; }

      /* On narrow screens the center-top mode toggle collided with the
         status pill on the left, so we drop it into the left column under
         status and slide the speed slider + util row down to match. */
      #mode-toggle {
        top: calc(54px + var(--safe-top));
        left: 12px;
        transform: none;
      }
      #mode-hint { display: none; }   /* labels are clear; reclaim space */
      #power-box   { top: calc(94px + var(--safe-top)); }
      #util-row    { top: calc(140px + var(--safe-top)); }
      #power-slider  { width: 110px; }
      #estop         { width: 70px; height: 70px; }
      #screen-toggle { top: calc(92px + var(--safe-top)); width: 70px; height: 70px; }
      .util-btn      { width: 64px; }
    }
  </style>
</head>
<body>
  <div id="stage">
    <!-- H.264 / fMP4 via MSE is the default; the <img> fallback is shown
         only when MSE isn't supported (older Safari) or the WS path fails. -->
    <video id="video" autoplay muted playsinline></video>
    <img id="video-mjpeg" alt="rover camera" hidden>

    <div id="snapshot-panel" hidden>
      <img id="snapshot" alt="latest snapshot">
      <div id="snapshot-empty">No snapshot yet — tap below to pull a frame.</div>
      <div id="snapshot-controls">
        <button id="snapshot-btn">📸 SNAPSHOT</button>
        <div id="snapshot-meta">
          <span id="snapshot-ts">—</span>
          <span class="sep">·</span>
          <span id="data-counter">0 KB this session</span>
        </div>
      </div>
    </div>

    <div id="mode-toggle" role="group" aria-label="Connection mode">
      <button id="mode-lan"  class="mode-btn active" data-mode="lan">LAN</button>
      <button id="mode-cell" class="mode-btn"        data-mode="cell">CELLULAR</button>
    </div>
    <div id="mode-hint"></div>

    <div id="bbox-overlay">
      <div id="bbox-label">dog</div>
    </div>

    <div id="status">
      <span class="v" id="bat">— V</span>
      <span class="sep">·</span><span id="fps">— fps</span>
      <span class="sep">·</span>gain <span id="gain">—</span>
      <span class="sep">·</span><span class="v" id="temp">— °C</span>
    </div>

    <div id="power-box">
      <label for="power-slider">Speed</label>
      <input id="power-slider" type="range" min="10" max="100" step="5" value="100">
      <span id="power-value">100%</span>
    </div>

    <div id="util-row">
      <button id="reboot-btn"   class="util-btn">REBOOT</button>
      <button id="poweroff-btn" class="util-btn">POWER<br>OFF</button>
      <button id="follow-btn"   class="util-btn">FOLLOW<br>OFF</button>
    </div>

    <button id="estop"          class="right-btn">E-STOP</button>
    <button id="screen-toggle"  class="right-btn" title="Toggle rover touchscreen">ROVER<br>SCREEN<br>OFF</button>

    <div id="dpad">
      <button id="btn-forward"      class="action-btn" data-action="forward">▲</button>
      <button id="btn-rotate-left"  class="action-btn" data-action="rotate-left">◄</button>
      <button id="btn-rotate-right" class="action-btn" data-action="rotate-right">►</button>
      <button id="btn-backward"     class="action-btn" data-action="backward">▼</button>
      <div class="pad-label">drive · turn</div>
    </div>

    <div id="strafe-pad">
      <button id="btn-strafe-left"  class="action-btn" data-action="strafe-left">←</button>
      <button id="btn-strafe-right" class="action-btn" data-action="strafe-right">→</button>
      <div class="pad-label">strafe</div>
    </div>

    <div id="ws-state" class="bad">disconnected</div>
  </div>

<script>
(() => {
  // Camera native frame size — used to scale the bbox overlay onto the
  // <img> element. Camera always streams at this resolution (see ascam config).
  const CAM_W = 640, CAM_H = 480;

  // --- WebSocket -----------------------------------------------------------
  const wsState = document.getElementById("ws-state");
  let ws = null;
  let wsReady = false;
  function send(msg) { if (wsReady) ws.send(JSON.stringify(msg)); }
  function connect() {
    ws = new WebSocket(`ws://${location.host}/ws`);
    ws.onopen  = () => {
      wsReady = true;
      wsState.textContent = "connected"; wsState.className = "ok";
      send({ type: "set_power", value: powerValue() / 100 });
    };
    ws.onclose = () => { wsReady = false; wsState.textContent = "reconnecting…"; wsState.className = "bad"; setTimeout(connect, 1000); };
    ws.onerror = () => { try { ws.close(); } catch (e) {} };
  }

  // --- Action buttons (D-pad + strafe) -------------------------------------
  const ACTION_DELTAS = {
    "forward":      { vx: +1, vy:  0, omega:  0 },
    "backward":     { vx: -1, vy:  0, omega:  0 },
    "rotate-left":  { vx:  0, vy:  0, omega: +1 },
    "rotate-right": { vx:  0, vy:  0, omega: -1 },
    "strafe-left":  { vx:  0, vy: +1, omega:  0 },
    "strafe-right": { vx:  0, vy: -1, omega:  0 },
  };
  const activeActions = new Set();
  const clamp = v => Math.max(-1, Math.min(1, v));

  function drive() {
    let vx = 0, vy = 0, omega = 0;
    for (const a of activeActions) {
      const d = ACTION_DELTAS[a];
      if (!d) continue;
      vx += d.vx; vy += d.vy; omega += d.omega;
    }
    return { vx: clamp(vx), vy: clamp(vy), omega: clamp(omega) };
  }

  function sendDriveNow() {
    if (!wsReady) return;
    const d = drive();
    ws.send(JSON.stringify({ type: "drive", vx: d.vx, vy: d.vy, omega: d.omega }));
  }

  function startAction(btn, action) {
    if (activeActions.has(action)) return;
    activeActions.add(action);
    btn.classList.add("active");
    sendDriveNow();
  }
  function stopAction(btn, action) {
    if (!activeActions.has(action)) return;
    activeActions.delete(action);
    btn.classList.remove("active");
    sendDriveNow();
  }

  document.querySelectorAll(".action-btn").forEach(btn => {
    const action = btn.dataset.action;
    btn.addEventListener("pointerdown", e => {
      try { btn.setPointerCapture(e.pointerId); } catch (_) {}
      startAction(btn, action);
    });
    btn.addEventListener("pointerup",     () => stopAction(btn, action));
    btn.addEventListener("pointercancel", () => stopAction(btn, action));
  });

  function clearAllActions() {
    if (activeActions.size === 0) return;
    activeActions.clear();
    document.querySelectorAll(".action-btn.active").forEach(b => b.classList.remove("active"));
    sendDriveNow();
  }
  document.addEventListener("visibilitychange", () => { if (document.hidden) clearAllActions(); });
  window.addEventListener("blur", clearAllActions);

  // --- Power slider --------------------------------------------------------
  const slider = document.getElementById("power-slider");
  const sliderValueEl = document.getElementById("power-value");
  function powerValue() { return parseInt(slider.value, 10); }
  function reflectPower() {
    const v = powerValue();
    sliderValueEl.textContent = v + "%";
    sliderValueEl.classList.toggle("mid", v < 70 && v >= 40);
    sliderValueEl.classList.toggle("low", v < 40);
  }
  const savedPower = parseInt(localStorage.getItem("rover_power") || "100", 10);
  slider.value = Math.max(10, Math.min(100, savedPower || 100));
  reflectPower();
  let powerSendTimer = null;
  slider.addEventListener("input", () => {
    reflectPower();
    localStorage.setItem("rover_power", String(powerValue()));
    clearTimeout(powerSendTimer);
    powerSendTimer = setTimeout(() => send({ type: "set_power", value: powerValue() / 100 }), 80);
  });

  // --- Screen toggle -------------------------------------------------------
  const screenBtn = document.getElementById("screen-toggle");
  let screenOn = true;
  function reflectScreen() {
    screenBtn.innerHTML = screenOn ? "ROVER<br>SCREEN<br>OFF" : "ROVER<br>SCREEN<br>ON";
    screenBtn.classList.toggle("off", !screenOn);
  }
  reflectScreen();
  screenBtn.addEventListener("click", () => {
    screenOn = !screenOn;
    reflectScreen();
    send({ type: "set_display", on: screenOn });
  });

  // --- Reboot / Power off --------------------------------------------------
  document.getElementById("reboot-btn").addEventListener("click", () => {
    if (confirm("Reboot the rover? It'll come back in about 30 seconds.")) {
      send({ type: "shutdown", action: "reboot" });
    }
  });
  document.getElementById("poweroff-btn").addEventListener("click", () => {
    if (confirm("Power off the rover? You'll need to power it back on manually.")) {
      send({ type: "shutdown", action: "poweroff" });
    }
  });

  // --- Follow toggle -------------------------------------------------------
  const followBtn = document.getElementById("follow-btn");
  let followEnabled = false;
  followBtn.addEventListener("click", () => {
    followEnabled = !followEnabled;
    // Reflect the requested state immediately; status colors update from
    // /telemetry (server-side truth — covers init failures).
    followBtn.innerHTML = followEnabled ? "FOLLOW<br>ON" : "FOLLOW<br>OFF";
    send({ type: "set_follow_mode", enabled: followEnabled });
  });

  // --- E-stop --------------------------------------------------------------
  document.getElementById("estop").addEventListener("click", () => send({ type: "estop" }));

  // --- Video stream (H.264/fMP4 over WS, MJPEG fallback) ------------------
  // Decide once at load: H.264 if the browser supports MSE + AVC1 baseline,
  // otherwise fall back to the legacy multipart MJPEG <img>. URL param
  // ?stream=mjpeg or ?stream=h264 forces a mode for A/B testing.
  // In Cellular mode the stream is torn down entirely — the snapshot panel
  // takes the visual stage and pulls a single JPEG on demand.
  const video = document.getElementById("video");
  const videoMjpeg = document.getElementById("video-mjpeg");
  // AVC1 baseline level 3.1 covers up to 720p30; widely supported including
  // mobile Safari. Match the encoder's profile/level if you ever change it.
  const H264_MIME = 'video/mp4; codecs="avc1.42E01F"';
  const forcedStreamMode = new URLSearchParams(location.search).get("stream");
  let videoMode = null;          // "h264" | "mjpeg" | null (Cellular = idle)
  let videoSocket = null;
  let mediaSource = null;
  let sourceBuffer = null;
  let h264Pending = [];
  let h264Appending = false;
  let h264ReconnectTimer = null;

  function activeVideoEl() { return videoMode === "h264" ? video : videoMjpeg; }

  function mseSupportsH264() {
    return !!window.MediaSource && MediaSource.isTypeSupported(H264_MIME);
  }
  function pickInitialMode() {
    if (forcedStreamMode === "mjpeg" || forcedStreamMode === "h264") return forcedStreamMode;
    return mseSupportsH264() ? "h264" : "mjpeg";
  }

  function showH264()  { video.hidden = false; videoMjpeg.hidden = true;  videoMjpeg.removeAttribute("src"); }
  function showMjpeg() { video.hidden = true;  videoMjpeg.hidden = false; videoMjpeg.src = "/video.mjpg?t=" + Date.now(); }
  function hideAllVideo() { video.hidden = true; videoMjpeg.hidden = true; videoMjpeg.removeAttribute("src"); }

  function teardownH264() {
    try { if (videoSocket) videoSocket.close(); } catch (_) {}
    videoSocket = null;
    try {
      if (mediaSource && mediaSource.readyState === "open") mediaSource.endOfStream();
    } catch (_) {}
    mediaSource = null;
    sourceBuffer = null;
    h264Pending = [];
    h264Appending = false;
    if (h264ReconnectTimer) { clearTimeout(h264ReconnectTimer); h264ReconnectTimer = null; }
  }

  function pumpH264() {
    if (h264Appending || !sourceBuffer || sourceBuffer.updating) return;
    if (h264Pending.length === 0) return;
    const chunk = h264Pending.shift();
    h264Appending = true;
    try {
      sourceBuffer.appendBuffer(chunk);
    } catch (e) {
      h264Appending = false;
      if (e.name === "QuotaExceededError") {
        // Drop everything but the last ~2 s, then retry on next updateend.
        try {
          const buf = sourceBuffer.buffered;
          if (buf.length > 0) {
            const trimTo = Math.max(0, buf.end(buf.length - 1) - 2);
            sourceBuffer.remove(0, trimTo);
          }
        } catch (_) {}
        h264Pending.unshift(chunk);
      } else {
        console.warn("MSE appendBuffer:", e);
        scheduleH264Reconnect();
      }
    }
  }

  function openH264Socket() {
    const scheme = location.protocol === "https:" ? "wss" : "ws";
    videoSocket = new WebSocket(`${scheme}://${location.host}/ws/video`);
    videoSocket.binaryType = "arraybuffer";
    videoSocket.onmessage = (ev) => {
      h264Pending.push(new Uint8Array(ev.data));
      pumpH264();
    };
    videoSocket.onclose = (ev) => {
      // 1011 + "ffmpeg" reason = rover is missing the dep. Don't retry.
      if (ev.code === 1011 && /ffmpeg/i.test(ev.reason || "")) {
        console.warn("rover ffmpeg missing; falling back to MJPEG");
        fallbackToMjpeg();
        return;
      }
      // Don't auto-reconnect if the user has switched to Cellular mode —
      // the close was probably us tearing down the socket on purpose.
      if (mode !== "cell") scheduleH264Reconnect();
    };
    videoSocket.onerror = (e) => { console.warn("video WS error:", e); };
  }

  function scheduleH264Reconnect() {
    if (h264ReconnectTimer || videoMode !== "h264" || mode === "cell") return;
    h264ReconnectTimer = setTimeout(() => {
      h264ReconnectTimer = null;
      if (videoMode === "h264" && mode !== "cell") startH264();
    }, 1500);
  }

  function startH264() {
    videoMode = "h264";
    showH264();
    teardownH264();
    mediaSource = new MediaSource();
    video.src = URL.createObjectURL(mediaSource);
    mediaSource.addEventListener("sourceopen", () => {
      try { URL.revokeObjectURL(video.src); } catch (_) {}
      try {
        sourceBuffer = mediaSource.addSourceBuffer(H264_MIME);
      } catch (e) {
        console.warn("addSourceBuffer failed; falling back to MJPEG:", e);
        fallbackToMjpeg();
        return;
      }
      sourceBuffer.mode = "sequence";
      sourceBuffer.addEventListener("updateend", () => {
        h264Appending = false;
        pumpH264();
      });
      openH264Socket();
    }, { once: true });
  }

  function fallbackToMjpeg() {
    videoMode = "mjpeg";
    teardownH264();
    showMjpeg();
  }

  function startVideoStream() {
    if (pickInitialMode() === "h264") startH264();
    else { videoMode = "mjpeg"; showMjpeg(); }
  }

  function stopVideoStream() {
    // Snapshot mode: stop whatever stream is running and hide both elements.
    // The snapshot panel takes over the visual stage; the live feed would
    // just keep burning bandwidth otherwise.
    teardownH264();
    videoMode = null;
    hideAllVideo();
  }

  // --- Mode toggle (LAN / Cellular) ---------------------------------------
  // LAN: live video (H.264 via MSE preferred, MJPEG fallback).
  // Cellular: stream torn down, snapshot button instead. Telemetry stays
  // live in both modes (text is cheap). KB counter resets on each entry
  // into Cellular and sums snapshot + telemetry bytes from that point.
  const modeLanBtn    = document.getElementById("mode-lan");
  const modeCellBtn   = document.getElementById("mode-cell");
  const modeHint      = document.getElementById("mode-hint");
  const snapshotPanel = document.getElementById("snapshot-panel");
  const snapshotImg   = document.getElementById("snapshot");
  const snapshotEmpty = document.getElementById("snapshot-empty");
  const snapshotBtn   = document.getElementById("snapshot-btn");
  const snapshotTs    = document.getElementById("snapshot-ts");
  const dataCounter   = document.getElementById("data-counter");

  let mode = localStorage.getItem("rover_mode") === "cell" ? "cell" : "lan";
  let cellBytes = 0;
  let lastSnapshotUrl = null;

  function fmtBytes(bytes) {
    const kb = bytes / 1024;
    return kb < 1024 ? kb.toFixed(1) + " KB" : (kb / 1024).toFixed(2) + " MB";
  }
  function updateDataCounter() {
    dataCounter.textContent = (mode === "cell")
      ? `${fmtBytes(cellBytes)} this session`
      : "";
  }
  function reflectMode() {
    const isCell = mode === "cell";
    modeLanBtn.classList.toggle("active", !isCell);
    modeCellBtn.classList.toggle("active", isCell);
    modeHint.textContent = isCell
      ? "snapshots only — saves data"
      : "live stream — use on Wi-Fi";
    if (isCell) {
      stopVideoStream();
      snapshotPanel.hidden = false;
    } else {
      snapshotPanel.hidden = true;
      startVideoStream();
    }
  }
  function setMode(newMode) {
    if (newMode !== "lan" && newMode !== "cell") return;
    if (newMode === mode) return;
    mode = newMode;
    if (mode === "cell") cellBytes = 0;  // reset on entering cellular
    localStorage.setItem("rover_mode", mode);
    reflectMode();
    updateDataCounter();
  }
  modeLanBtn.addEventListener("click",  () => setMode("lan"));
  modeCellBtn.addEventListener("click", () => setMode("cell"));

  snapshotBtn.addEventListener("click", async () => {
    snapshotBtn.disabled = true;
    try {
      const r = await fetch("/api/snapshot", { cache: "no-store" });
      if (!r.ok) throw new Error("snapshot " + r.status);
      const blob = await r.blob();
      cellBytes += blob.size;
      if (lastSnapshotUrl) URL.revokeObjectURL(lastSnapshotUrl);
      lastSnapshotUrl = URL.createObjectURL(blob);
      snapshotImg.src = lastSnapshotUrl;
      snapshotImg.classList.add("has-image");
      snapshotEmpty.classList.add("hidden");
      const now = new Date();
      const pad = n => String(n).padStart(2, "0");
      snapshotTs.textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
      updateDataCounter();
    } catch (_) {
      snapshotTs.textContent = "failed";
    } finally {
      snapshotBtn.disabled = false;
    }
  });

  // Kick everything off — reflectMode handles LAN (start stream) and
  // Cellular (skip stream, show snapshot panel).
  reflectMode();
  updateDataCounter();

  // --- Ticks ---------------------------------------------------------------
  connect();
  setInterval(sendDriveNow, 50);

  // --- Telemetry poll + bbox overlay ---------------------------------------
  const bat  = document.getElementById("bat");
  const fps  = document.getElementById("fps");
  const gain = document.getElementById("gain");
  const temp = document.getElementById("temp");
  const bbox = document.getElementById("bbox-overlay");
  const bboxLabel = document.getElementById("bbox-label");

  function reflectFollowStatus(j) {
    // Server-truth state of follow: button label tracks server-truth
    // "follow_enabled", and the color reflects the live status.
    followEnabled = !!j.follow_enabled;
    followBtn.innerHTML = followEnabled ? "FOLLOW<br>ON" : "FOLLOW<br>OFF";
    followBtn.classList.remove("tracking", "searching", "too-close", "initializing");
    const status = j.follow_status;
    if (status === "tracking")        followBtn.classList.add("tracking");
    else if (status === "searching")  followBtn.classList.add("searching");
    else if (status === "too_close")  followBtn.classList.add("too-close");
    else if (status === "initializing") followBtn.classList.add("initializing");
  }

  function reflectBbox(j) {
    // No video to overlay onto in Cellular mode — keep the panel clean.
    if (mode === "cell" || !j.dog_bbox || !j.follow_enabled) {
      bbox.style.display = "none";
      return;
    }
    // Compute the video's actual rendered rect inside the stage and scale
    // the bbox from camera-native coords (640×480) to display coords. Use
    // whichever element is currently visible — <video> for H.264, <img>
    // for the MJPEG fallback.
    const stageRect = document.getElementById("stage").getBoundingClientRect();
    const vRect = activeVideoEl().getBoundingClientRect();
    const dispW = vRect.width, dispH = vRect.height;
    if (dispW < 1 || dispH < 1) return;

    // object-fit: contain means the actual image content is centered with
    // possible letterboxing. Compute the content rect inside vRect.
    const contentScale = Math.min(dispW / CAM_W, dispH / CAM_H);
    const contentW = CAM_W * contentScale;
    const contentH = CAM_H * contentScale;
    const contentLeft = vRect.left + (dispW - contentW) / 2 - stageRect.left;
    const contentTop  = vRect.top  + (dispH - contentH) / 2 - stageRect.top;

    const [x1, y1, x2, y2] = j.dog_bbox;
    bbox.style.display = "block";
    bbox.style.left   = (contentLeft + x1 * contentScale) + "px";
    bbox.style.top    = (contentTop  + y1 * contentScale) + "px";
    bbox.style.width  = ((x2 - x1) * contentScale) + "px";
    bbox.style.height = ((y2 - y1) * contentScale) + "px";
    bbox.classList.toggle("too-close", j.follow_status === "too_close");

    const conf = (j.dog_confidence != null) ? ` ${(j.dog_confidence * 100).toFixed(0)}%` : "";
    bboxLabel.textContent = "dog" + conf;
  }

  async function pollTelemetry() {
    try {
      const r = await fetch("/telemetry");
      if (r.ok) {
        const text = await r.text();
        // Telemetry is ASCII JSON in practice, so .length ≈ byte size. We
        // bill it against the session counter only while we're spending
        // cellular data — LAN mode hides the counter anyway.
        if (mode === "cell") {
          cellBytes += text.length;
          updateDataCounter();
        }
        const j = JSON.parse(text);
        if (j.battery_v != null) {
          bat.textContent = j.battery_v.toFixed(2) + " V";
          bat.classList.remove("mid", "low");
          if      (j.battery_v < 12.5) bat.classList.add("low");
          else if (j.battery_v < 13.0) bat.classList.add("mid");
        }
        if (j.camera_fps  != null) { fps.textContent  = j.camera_fps.toFixed(1) + " fps"; }
        if (j.camera_gain != null) { gain.textContent = j.camera_gain.toFixed(1) + "×"; }
        if (j.cpu_temp_c != null) {
          temp.textContent = j.cpu_temp_c.toFixed(0) + " °C";
          temp.classList.remove("mid", "low");
          if      (j.cpu_temp_c >= 78) temp.classList.add("low");
          else if (j.cpu_temp_c >= 70) temp.classList.add("mid");
        }
        reflectFollowStatus(j);
        reflectBbox(j);
      }
    } catch (_) {}
    setTimeout(pollTelemetry, 500);
  }
  pollTelemetry();
})();
</script>
</body>
</html>
