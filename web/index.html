<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Rover</title>
  <style>
    *  { box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0;
      /* 100vh on iOS Safari is the max viewport (chrome hidden), so content
         positioned bottom:Npx can end up under the URL bar. 100dvh is the
         dynamic visible viewport — shrinks/grows with the chrome. Browsers
         without dvh ignore the second declaration and fall back to vh. */
      height: 100vh;
      height: 100dvh;
      width: 100vw;
      background: #0a0a0a; color: #eee;
      font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      overflow: hidden;
    }

    /* Bottom-anchored UI lifts itself well above iOS Safari's URL bar +
       gesture strip. Static 80 px is enough on every iPhone we've tested;
       env(safe-area-inset-bottom) is added on top for the home-indicator
       region. On Chromium kiosk, env returns 0 → just the 80 px lift. */
    :root {
      --safe-top:    env(safe-area-inset-top,    0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    #stage { position: relative; width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
    #video { max-width: 100%; max-height: 100%; object-fit: contain; }

    /* Status (top-left). top includes safe-area-inset-top so the row
       clears the iOS notch / Dynamic Island / Safari top bar instead of
       hiding behind it. */
    #status {
      position: absolute; top: calc(12px + var(--safe-top)); left: 12px;
      background: rgba(0,0,0,0.55); padding: 8px 12px; border-radius: 8px;
      font-size: 14px; font-variant-numeric: tabular-nums; pointer-events: none;
    }
    #status .v   { color: #6f6; font-weight: 600; }
    #status .v.mid { color: #ffc107; }
    #status .v.low { color: #f66; }
    #status .sep { opacity: 0.4; margin: 0 6px; }

    /* Speed slider — stacks directly under the status row. */
    #power-box {
      position: absolute; top: calc(52px + var(--safe-top)); left: 12px;
      background: rgba(0,0,0,0.55); padding: 8px 14px; border-radius: 8px;
      font-size: 13px; font-variant-numeric: tabular-nums;
      display: flex; align-items: center; gap: 10px;
    }
    #power-box label { opacity: 0.75; letter-spacing: 0.04em; text-transform: uppercase; font-size: 11px; }
    #power-slider {
      -webkit-appearance: none; appearance: none;
      width: 150px; height: 6px;
      background: linear-gradient(to right, #f66 0%, #ffc107 40%, #6f6 70%);
      border-radius: 6px; outline: none; cursor: pointer; touch-action: none;
    }
    #power-slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 22px; height: 22px; border-radius: 50%; background: #eee; border: 2px solid #444; cursor: pointer; }
    #power-slider::-moz-range-thumb     { width: 22px; height: 22px; border-radius: 50%; background: #eee; border: 2px solid #444; cursor: pointer; }
    #power-value { min-width: 42px; text-align: right; font-weight: 600; color: #6f6; }
    #power-value.mid { color: #ffc107; }
    #power-value.low { color: #f66; }

    /* Utility row (REBOOT + POWER OFF) — moved to the top-left under the
       slider so they don't extend the right column down onto the video. */
    #util-row {
      position: absolute; top: calc(100px + var(--safe-top)); left: 12px;
      display: flex; gap: 6px;
    }
    .util-btn {
      width: 86px; height: 34px;
      border-radius: 6px;
      font-size: 11px; font-weight: bold;
      cursor: pointer; letter-spacing: 0.03em;
      transition: background 0.1s, color 0.1s, border-color 0.1s;
    }
    #reboot-btn {
      border: 1.5px solid rgba(120,160,255,0.4);
      background: rgba(40,55,90,0.6); color: #abf;
    }
    #reboot-btn:active { background: rgba(60,90,160,0.7); color: #fff; }
    #poweroff-btn {
      border: 1.5px solid rgba(255,255,255,0.2);
      background: rgba(40,40,40,0.6); color: #aaa;
    }
    #poweroff-btn:active { background: rgba(80,80,80,0.7); color: #fff; }

    /* Right-side safety column — only the two big controls now. */
    .right-btn {
      position: absolute; right: 12px;
      border-radius: 12px; font-weight: bold; cursor: pointer;
      transition: background 0.1s, color 0.1s, border-color 0.1s;
    }
    #estop {
      top: calc(12px + var(--safe-top)); width: 76px; height: 76px; border-radius: 50%;
      border: 3px solid #f33; background: #511; color: #f99; font-size: 13px;
    }
    #estop:active { background: #f33; color: #fff; }
    #screen-toggle {
      top: calc(100px + var(--safe-top)); width: 76px; height: 76px;
      border: 2px solid rgba(255,255,255,0.3);
      background: rgba(60,60,60,0.5); color: #ddd; font-size: 11px;
    }
    #screen-toggle.off { background: rgba(80,40,40,0.5); color: #f99; border-color: rgba(255,100,100,0.4); }

    /* D-pad and strafe pad — lifted well clear of Safari's bottom chrome. */
    #dpad {
      position: absolute; left: 24px;
      bottom: calc(80px + var(--safe-bottom));
      width: 200px; height: 200px;
    }
    #strafe-pad {
      position: absolute; right: 24px;
      bottom: calc(80px + var(--safe-bottom));
      width: 144px; height: 64px;
    }
    .action-btn {
      position: absolute;
      width: 64px; height: 64px;
      border-radius: 14px;
      border: 2px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.06);
      color: rgba(255,255,255,0.8);
      font-size: 28px; font-weight: bold;
      cursor: pointer; touch-action: none;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.04s linear, border-color 0.04s linear;
    }
    .action-btn.active {
      background: rgba(120, 200, 120, 0.35);
      border-color: rgba(180, 255, 180, 0.7);
      color: #fff;
    }
    #btn-forward      { top: 0;    left: 68px; }
    #btn-rotate-left  { top: 68px; left: 0; }
    #btn-rotate-right { top: 68px; left: 136px; }
    #btn-backward     { top: 136px;left: 68px; }
    #btn-strafe-left  { left: 0; top: 0; }
    #btn-strafe-right { left: 80px; top: 0; }
    .pad-label {
      position: absolute; bottom: -20px; left: 0; right: 0;
      text-align: center; font-size: 10px; letter-spacing: 0.08em;
      text-transform: uppercase; color: rgba(255,255,255,0.45);
      pointer-events: none;
    }

    /* Connection indicator — same lift as the pads, slightly lower base
       so it sits just under them rather than alongside. */
    #ws-state {
      position: absolute; left: 50%; transform: translateX(-50%);
      bottom: calc(56px + var(--safe-bottom));
      font-size: 12px; padding: 4px 10px; border-radius: 4px;
      background: rgba(0,0,0,0.55); pointer-events: none;
    }
    #ws-state.ok  { color: #6f6; }
    #ws-state.bad { color: #f66; }

    @media (max-width: 600px) {
      #dpad       { width: 168px; height: 168px; left: 16px; }
      #strafe-pad { width: 120px; height: 56px;  right: 16px; }
      .action-btn { width: 56px; height: 56px; font-size: 24px; border-radius: 12px; }
      #btn-forward      { top: 0;     left: 56px; }
      #btn-rotate-left  { top: 56px;  left: 0; }
      #btn-rotate-right { top: 56px;  left: 112px; }
      #btn-backward     { top: 112px; left: 56px; }
      #btn-strafe-left  { left: 0; }
      #btn-strafe-right { left: 64px; }

      #power-slider  { width: 110px; }
      #estop         { width: 70px; height: 70px; }
      #screen-toggle { top: calc(90px + var(--safe-top)); width: 70px; height: 70px; }
      #util-row      { top: calc(96px + var(--safe-top)); }
      .util-btn      { width: 76px; }
    }
  </style>
</head>
<body>
  <div id="stage">
    <img id="video" src="/video.mjpg" alt="rover camera">

    <div id="status">
      <span class="v" id="bat">— V</span>
      <span class="sep">·</span><span id="fps">— fps</span>
      <span class="sep">·</span>gain <span id="gain">—</span>
      <span class="sep">·</span><span class="v" id="temp">— °C</span>
    </div>

    <div id="power-box">
      <label for="power-slider">Speed</label>
      <input id="power-slider" type="range" min="10" max="100" step="5" value="100">
      <span id="power-value">100%</span>
    </div>

    <div id="util-row">
      <button id="reboot-btn"   class="util-btn">REBOOT</button>
      <button id="poweroff-btn" class="util-btn">POWER OFF</button>
    </div>

    <button id="estop"          class="right-btn">E-STOP</button>
    <button id="screen-toggle"  class="right-btn" title="Toggle rover touchscreen">TURN<br>OFF</button>

    <div id="dpad">
      <button id="btn-forward"      class="action-btn" data-action="forward">▲</button>
      <button id="btn-rotate-left"  class="action-btn" data-action="rotate-left">◄</button>
      <button id="btn-rotate-right" class="action-btn" data-action="rotate-right">►</button>
      <button id="btn-backward"     class="action-btn" data-action="backward">▼</button>
      <div class="pad-label">drive · turn</div>
    </div>

    <div id="strafe-pad">
      <button id="btn-strafe-left"  class="action-btn" data-action="strafe-left">←</button>
      <button id="btn-strafe-right" class="action-btn" data-action="strafe-right">→</button>
      <div class="pad-label">strafe</div>
    </div>

    <div id="ws-state" class="bad">disconnected</div>
  </div>

<script>
(() => {
  // --- WebSocket -----------------------------------------------------------
  const wsState = document.getElementById("ws-state");
  let ws = null;
  let wsReady = false;
  function send(msg) { if (wsReady) ws.send(JSON.stringify(msg)); }
  function connect() {
    ws = new WebSocket(`ws://${location.host}/ws`);
    ws.onopen  = () => {
      wsReady = true;
      wsState.textContent = "connected"; wsState.className = "ok";
      send({ type: "set_power", value: powerValue() / 100 });
    };
    ws.onclose = () => { wsReady = false; wsState.textContent = "reconnecting…"; wsState.className = "bad"; setTimeout(connect, 1000); };
    ws.onerror = () => { try { ws.close(); } catch (e) {} };
  }

  // --- Action buttons (D-pad + strafe) -------------------------------------
  const ACTION_DELTAS = {
    "forward":      { vx: +1, vy:  0, omega:  0 },
    "backward":     { vx: -1, vy:  0, omega:  0 },
    "rotate-left":  { vx:  0, vy:  0, omega: +1 },
    "rotate-right": { vx:  0, vy:  0, omega: -1 },
    "strafe-left":  { vx:  0, vy: +1, omega:  0 },
    "strafe-right": { vx:  0, vy: -1, omega:  0 },
  };

  const activeActions = new Set();
  const clamp = v => Math.max(-1, Math.min(1, v));

  function drive() {
    let vx = 0, vy = 0, omega = 0;
    for (const a of activeActions) {
      const d = ACTION_DELTAS[a];
      if (!d) continue;
      vx += d.vx; vy += d.vy; omega += d.omega;
    }
    return { vx: clamp(vx), vy: clamp(vy), omega: clamp(omega) };
  }

  function sendDriveNow() {
    if (!wsReady) return;
    const d = drive();
    ws.send(JSON.stringify({ type: "drive", vx: d.vx, vy: d.vy, omega: d.omega }));
  }

  function startAction(btn, action) {
    if (activeActions.has(action)) return;
    activeActions.add(action);
    btn.classList.add("active");
    sendDriveNow();
  }
  function stopAction(btn, action) {
    if (!activeActions.has(action)) return;
    activeActions.delete(action);
    btn.classList.remove("active");
    sendDriveNow();
  }

  document.querySelectorAll(".action-btn").forEach(btn => {
    const action = btn.dataset.action;
    btn.addEventListener("pointerdown", e => {
      try { btn.setPointerCapture(e.pointerId); } catch (_) {}
      startAction(btn, action);
    });
    btn.addEventListener("pointerup",     () => stopAction(btn, action));
    btn.addEventListener("pointercancel", () => stopAction(btn, action));
  });

  function clearAllActions() {
    if (activeActions.size === 0) return;
    activeActions.clear();
    document.querySelectorAll(".action-btn.active").forEach(b => b.classList.remove("active"));
    sendDriveNow();
  }
  document.addEventListener("visibilitychange", () => { if (document.hidden) clearAllActions(); });
  window.addEventListener("blur", clearAllActions);

  // --- Power slider --------------------------------------------------------
  const slider = document.getElementById("power-slider");
  const sliderValueEl = document.getElementById("power-value");
  function powerValue() { return parseInt(slider.value, 10); }
  function reflectPower() {
    const v = powerValue();
    sliderValueEl.textContent = v + "%";
    sliderValueEl.classList.toggle("mid", v < 70 && v >= 40);
    sliderValueEl.classList.toggle("low", v < 40);
  }
  const savedPower = parseInt(localStorage.getItem("rover_power") || "100", 10);
  slider.value = Math.max(10, Math.min(100, savedPower || 100));
  reflectPower();
  let powerSendTimer = null;
  slider.addEventListener("input", () => {
    reflectPower();
    localStorage.setItem("rover_power", String(powerValue()));
    clearTimeout(powerSendTimer);
    powerSendTimer = setTimeout(() => send({ type: "set_power", value: powerValue() / 100 }), 80);
  });

  // --- Screen toggle -------------------------------------------------------
  const screenBtn = document.getElementById("screen-toggle");
  let screenOn = true;
  function reflectScreen() {
    screenBtn.innerHTML = screenOn ? "TURN<br>OFF" : "TURN<br>ON";
    screenBtn.classList.toggle("off", !screenOn);
  }
  reflectScreen();
  screenBtn.addEventListener("click", () => {
    screenOn = !screenOn;
    reflectScreen();
    send({ type: "set_display", on: screenOn });
  });

  // --- Reboot / Power off (confirm before firing) --------------------------
  document.getElementById("reboot-btn").addEventListener("click", () => {
    if (confirm("Reboot the rover? It'll come back in about 30 seconds.")) {
      send({ type: "shutdown", action: "reboot" });
    }
  });
  document.getElementById("poweroff-btn").addEventListener("click", () => {
    if (confirm("Power off the rover? You'll need to power it back on manually.")) {
      send({ type: "shutdown", action: "poweroff" });
    }
  });

  // --- E-stop --------------------------------------------------------------
  document.getElementById("estop").addEventListener("click", () => send({ type: "estop" }));

  // --- Ticks ---------------------------------------------------------------
  connect();
  setInterval(sendDriveNow, 50);

  const bat  = document.getElementById("bat");
  const fps  = document.getElementById("fps");
  const gain = document.getElementById("gain");
  const temp = document.getElementById("temp");
  async function pollTelemetry() {
    try {
      const r = await fetch("/telemetry");
      if (r.ok) {
        const j = await r.json();
        if (j.battery_v != null) {
          bat.textContent = j.battery_v.toFixed(2) + " V";
          bat.classList.remove("mid", "low");
          // CYCLENBATT 12V 10Ah LiFePO4 — green ≥13.0, amber 12.5–13.0, red <12.5.
          if      (j.battery_v < 12.5) bat.classList.add("low");
          else if (j.battery_v < 13.0) bat.classList.add("mid");
        }
        if (j.camera_fps  != null) { fps.textContent  = j.camera_fps.toFixed(1) + " fps"; }
        if (j.camera_gain != null) { gain.textContent = j.camera_gain.toFixed(1) + "×"; }
        if (j.cpu_temp_c != null) {
          temp.textContent = j.cpu_temp_c.toFixed(0) + " °C";
          temp.classList.remove("mid", "low");
          // Passive-cooled Pi 5 idle ~78 °C; throttle 80 °C.
          //   green  < 70   (comfortable)
          //   amber  70–78  (warm but within budget)
          //   red    ≥ 78   (at the ceiling)
          if      (j.cpu_temp_c >= 78) temp.classList.add("low");
          else if (j.cpu_temp_c >= 70) temp.classList.add("mid");
        }
      }
    } catch (_) {}
    setTimeout(pollTelemetry, 500);
  }
  pollTelemetry();
})();
</script>
</body>
</html>
