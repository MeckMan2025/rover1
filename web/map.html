<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Rover · Map</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0;
      height: 100vh; height: 100dvh; width: 100vw;
      background: #0a0a0a; color: #eee;
      font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      overflow: hidden;
    }
    :root {
      --safe-top:    env(safe-area-inset-top,    0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    #map { width: 100vw; height: 100vh; height: 100dvh; display: block; touch-action: none; cursor: grab; background: #111; }
    #map.dragging { cursor: grabbing; }

    .chip {
      position: absolute;
      background: rgba(0,0,0,0.55); border-radius: 8px;
      font-size: 13px; font-variant-numeric: tabular-nums;
      padding: 8px 12px;
    }
    #status { top: calc(12px + var(--safe-top)); left: 12px; pointer-events: none; line-height: 1.5; }
    #status .v { color: #6f6; font-weight: 600; }
    #status .v.mid  { color: #ffc107; }
    #status .v.low  { color: #f66; }
    #status .sep { opacity: 0.4; margin: 0 6px; }

    #btn-row {
      position: absolute; top: calc(12px + var(--safe-top)); right: 12px;
      display: flex; flex-direction: column; gap: 8px; align-items: flex-end;
    }
    .map-btn {
      min-width: 84px; height: 40px; padding: 0 14px;
      border-radius: 8px; font-size: 12px; font-weight: bold; letter-spacing: 0.04em;
      cursor: pointer; transition: background 0.1s, color 0.1s, border-color 0.1s;
      border: 1.5px solid rgba(255,255,255,0.25);
      background: rgba(40,40,40,0.6); color: #ddd;
    }
    .map-btn:active { background: rgba(90,90,90,0.7); color: #fff; }
    #nav-btn { border-color: rgba(120,200,120,0.45); background: rgba(40,80,40,0.6); color: #cfc; }
    #nav-btn:active { background: rgba(60,140,60,0.75); color: #fff; }
    #nav-btn.running { background: rgba(150,60,60,0.75); color: #fff; border-color: #f66; }
    #nav-btn.busy    { background: rgba(120,90,30,0.7);  color: #ffd; border-color: #ffc107; }

    #zoom-col {
      position: absolute; right: 12px; bottom: calc(34px + var(--safe-bottom));
      display: flex; flex-direction: column; gap: 8px;
    }
    .zoom-btn {
      width: 44px; height: 44px; border-radius: 8px;
      border: 1.5px solid rgba(255,255,255,0.25);
      background: rgba(40,40,40,0.6); color: #ddd;
      font-size: 20px; font-weight: bold; cursor: pointer;
    }
    .zoom-btn:active { background: rgba(90,90,90,0.7); color: #fff; }
    #zoom-fit { font-size: 12px; letter-spacing: 0.03em; }

    #nav-line {
      position: absolute; left: 50%; transform: translateX(-50%);
      bottom: calc(34px + var(--safe-bottom));
      background: rgba(0,0,0,0.55); border-radius: 8px;
      padding: 8px 14px; font-size: 13px; font-variant-numeric: tabular-nums;
      pointer-events: none; white-space: nowrap; max-width: 92vw;
      overflow: hidden; text-overflow: ellipsis;
    }
    #nav-line .st { font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; }
    #nav-line .st.tracking, #nav-line .st.done { color: #6f6; }
    #nav-line .st.acquiring, #nav-line .st.aligning, #nav-line .st.paused { color: #ffc107; }
    #nav-line .st.fault { color: #f66; }

    #attrib {
      position: absolute; right: 4px; bottom: calc(2px + var(--safe-bottom));
      font-size: 9px; color: rgba(255,255,255,0.55);
      background: rgba(0,0,0,0.35); padding: 1px 5px; border-radius: 3px;
      pointer-events: none;
    }
    #toast {
      position: absolute; left: 50%; transform: translateX(-50%);
      bottom: calc(84px + var(--safe-bottom));
      background: rgba(150,50,50,0.9); color: #fff;
      padding: 10px 16px; border-radius: 8px; font-size: 13px; font-weight: 600;
      opacity: 0; transition: opacity 0.25s; pointer-events: none; max-width: 88vw;
    }
    #toast.show { opacity: 1; }
  </style>
</head>
<body>
  <svg id="map"></svg>

  <div id="status" class="chip">
    <span id="gps-line">GPS <span class="v low">—</span></span><br>
    <span id="pos-line" style="opacity:0.8">waiting for telemetry…</span>
  </div>

  <div id="btn-row">
    <button id="drive-btn" class="map-btn" onclick="location.href='/'">◄ DRIVE</button>
    <button id="nav-btn" class="map-btn">START PATH</button>
  </div>

  <div id="zoom-col">
    <button id="zoom-in"  class="zoom-btn">+</button>
    <button id="zoom-out" class="zoom-btn">−</button>
    <button id="zoom-fit" class="zoom-btn">FIT</button>
  </div>

  <div id="nav-line"><span class="st">loading…</span></div>
  <div id="attrib">Imagery © Esri, Maxar, Earthstar Geographics</div>
  <div id="toast"></div>

<script>
'use strict';
const SVGNS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('map');

// Parcel boundary (WGS84, from field_data KML — visualization only).
const PARCEL = [
  [41.5906282,-90.4896307],[41.5904091,-90.4896308],[41.5907239,-90.4900914],
  [41.5907427,-90.4900719],[41.5907635,-90.4900564],[41.5907859,-90.4900456],
  [41.5908093,-90.4900394],[41.5908331,-90.4900383],[41.5908567,-90.4900421],
  [41.5908619,-90.4896305],[41.5908478,-90.4896305],[41.5906282,-90.4896307]
];

let meta = null;           // map-sat.json: {z, tx0, ty0, width_px, height_px}
let vb = {x:0, y:0, w:100, h:100};
let fitBox = null;         // default view (path+parcel bbox)
let layers = {};           // svg groups
let markers = [];          // [{g, x, y, px}] scaled to constant screen size
let trail = [];            // rover breadcrumb, image-px coords
let navActive = false, navBusy = false;

// WGS84 -> image pixel (Web Mercator tile math, image px == user units).
function geoPx(lat, lon) {
  const n = Math.pow(2, meta.z) * 256;
  const lr = lat * Math.PI / 180;
  return {
    x: (lon + 180) / 360 * n - meta.tx0 * 256,
    y: (1 - Math.log(Math.tan(lr) + 1 / Math.cos(lr)) / Math.PI) / 2 * n - meta.ty0 * 256
  };
}

function applyVb() {
  svg.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
  // Markers keep constant on-screen size: scale by user-units-per-screen-px.
  const k = vb.w / svg.getBoundingClientRect().width;
  for (const m of markers) m.g.setAttribute('transform',
      `translate(${m.x} ${m.y}) scale(${k * m.px})`);
}

function zoomAt(cx, cy, f) {  // f < 1 zooms in
  const w = Math.min(Math.max(vb.w * f, 24), meta.width_px * 1.5);
  const s = w / vb.w;
  vb = {x: cx - (cx - vb.x) * s, y: cy - (cy - vb.y) * s, w: w, h: vb.h * s};
  applyVb();
}

function fit() {
  const r = svg.getBoundingClientRect(), a = r.width / r.height;
  let {x, y, w, h} = fitBox;
  if (w / h < a) { const w2 = h * a; x -= (w2 - w) / 2; w = w2; }
  else           { const h2 = w / a; y -= (h2 - h) / 2; h = h2; }
  vb = {x, y, w, h};
  applyVb();
}

function el(name, attrs, parent) {
  const e = document.createElementNS(SVGNS, name);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  (parent || svg).appendChild(e);
  return e;
}

function addMarker(x, y, px, build) {
  const g = el('g', {}, layers.markers);
  build(g);
  const rec = {g, x, y, px};
  markers.push(rec);
  return rec;
}

async function init() {
  meta = await (await fetch('/map-sat.json')).json();
  el('image', {href: '/map-sat.jpg', x: 0, y: 0,
               width: meta.width_px, height: meta.height_px});
  layers.parcel  = el('g', {});
  layers.path    = el('g', {});
  layers.trail   = el('g', {});
  layers.markers = el('g', {});

  // Parcel outline — dashed, understated.
  const pc = PARCEL.map(([la, lo]) => { const p = geoPx(la, lo); return `${p.x},${p.y}`; });
  el('polygon', {points: pc.join(' '), fill: 'rgba(255,210,74,0.06)',
                 stroke: '#ffd24a', 'stroke-width': 1.5, 'stroke-dasharray': '6 5',
                 'vector-effect': 'non-scaling-stroke', opacity: 0.9}, layers.parcel);

  // Surveyed path + spots.
  const pathData = await (await fetch('/api/nav/path')).json();
  const pts = pathData.points.map(p => ({...geoPx(p.lat, p.lon), label: p.label}));
  el('polyline', {points: pts.map(p => `${p.x},${p.y}`).join(' '), fill: 'none',
                  stroke: '#4ad2ff', 'stroke-width': 3, 'stroke-linejoin': 'round',
                  'stroke-linecap': 'round', 'vector-effect': 'non-scaling-stroke',
                  opacity: 0.95}, layers.path);
  const spots = pts.filter(p => p.label && p.label !== 'path');
  spots.forEach((p, i) => addMarker(p.x, p.y, 0.9, g => {
    const first = i === 0, last = i === spots.length - 1;
    const c = first ? '#6f6' : (last ? '#f66' : '#4ad2ff');
    el('circle', {r: 9, fill: 'rgba(0,0,0,0.6)', stroke: c, 'stroke-width': 2.5}, g);
    el('text', {y: 4.5, 'text-anchor': 'middle', fill: c, 'font-size': 12,
                'font-weight': 700, 'font-family': 'inherit'},
       g).textContent = p.label.replace(/[^0-9]/g, '') || '·';
  }));

  // Rover: heading wedge + dot + accuracy ring. Hidden until a fix arrives.
  trailLine = el('polyline', {points: '', fill: 'none', stroke: '#6f6',
                              'stroke-width': 2, 'stroke-dasharray': '1 5',
                              'stroke-linecap': 'round',
                              'vector-effect': 'non-scaling-stroke', opacity: 0.8},
                 layers.trail);
  // Accuracy ring lives in map units (a real-world circle should scale with
  // the map), unlike the marker itself which holds constant screen size.
  roverRing = el('circle', {r: 0, fill: 'rgba(110,255,110,0.12)',
                            stroke: 'rgba(110,255,110,0.4)', 'stroke-width': 1,
                            'vector-effect': 'non-scaling-stroke',
                            style: 'display:none'}, layers.trail);
  roverM = addMarker(0, 0, 1.0, g => {
    g.style.display = 'none';
    roverWedge = el('path', {d: 'M0,-16 L5.5,-6 L-5.5,-6 Z', fill: '#6f6',
                             opacity: 0.95}, g);
    el('circle', {r: 5.5, fill: '#6f6', stroke: '#0a0a0a', 'stroke-width': 2}, g);
  });

  // Default view: path + parcel with margin.
  const xs = pts.map(p => p.x).concat(pc.map(s => +s.split(',')[0]));
  const ys = pts.map(p => p.y).concat(pc.map(s => +s.split(',')[1]));
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  const y0 = Math.min(...ys), y1 = Math.max(...ys);
  const mg = Math.max(x1 - x0, y1 - y0) * 0.12;
  fitBox = {x: x0 - mg, y: y0 - mg, w: x1 - x0 + 2 * mg, h: y1 - y0 + 2 * mg};
  fit();
  poll();
  setInterval(poll, 1000);
}
let roverM, roverRing, roverWedge, trailLine;

// --- live telemetry ---------------------------------------------------------
const gpsLine = document.getElementById('gps-line');
const posLine = document.getElementById('pos-line');
const navLine = document.getElementById('nav-line');
const navBtn  = document.getElementById('nav-btn');

function fixCls(fix) {
  return fix === 'rtk_fixed' ? 'v' : (fix === 'rtk_float' ? 'v' :
         (fix === 'offline' || fix === 'none' ? 'v low' : 'v mid'));
}

async function poll() {
  let t;
  try { t = await (await fetch('/telemetry')).json(); }
  catch (e) {
    gpsLine.innerHTML = 'GPS <span class="v low">no link</span>';
    return;
  }
  const hacc = t.gps_hacc_m == null ? '—' :
      (t.gps_hacc_m >= 100 ? '>100 m' : t.gps_hacc_m.toFixed(2) + ' m');
  gpsLine.innerHTML =
      `GPS <span class="${fixCls(t.gps_fix)}">${(t.gps_fix || '—').replace('rtk_', 'RTK ').toUpperCase()}</span>` +
      `<span class="sep">·</span>${t.gps_sats} sats<span class="sep">·</span>±${hacc}`;

  if (t.gps_lat != null && meta) {
    const p = geoPx(t.gps_lat, t.gps_lon);
    roverM.x = p.x; roverM.y = p.y;
    roverM.g.style.display = '';
    // Accuracy ring: hAcc meters -> image px at this latitude/zoom.
    const mpp = 156543.03392 * Math.cos(t.gps_lat * Math.PI / 180) / Math.pow(2, meta.z);
    roverRing.style.display = '';
    roverRing.setAttribute('cx', p.x);
    roverRing.setAttribute('cy', p.y);
    roverRing.setAttribute('r', Math.max(0.5, (t.gps_hacc_m || 0) / mpp));
    // Heading: prefer the nav estimate (dead-reckoned between fixes),
    // else GPS course when actually moving.
    let hdg = t.nav_heading_deg;
    if (hdg == null && (t.gps_speed_mps || 0) > 0.12) hdg = t.gps_cog_deg;
    if (hdg != null) { roverWedge.style.display = ''; roverWedge.setAttribute('transform', `rotate(${hdg})`); }
    else roverWedge.style.display = 'none';
    posLine.textContent = `${t.gps_lat.toFixed(7)}, ${t.gps_lon.toFixed(7)}`;
    // Breadcrumbs while a mission runs (or the rover moves): ~1 per second.
    const lastT = trail[trail.length - 1];
    if (!lastT || Math.hypot(p.x - lastT.x, p.y - lastT.y) * mpp > 0.15) {
      trail.push(p);
      if (trail.length > 900) trail.shift();
      trailLine.setAttribute('points', trail.map(q => `${q.x},${q.y}`).join(' '));
    }
    applyVb();
  } else {
    roverM.g.style.display = 'none';
    roverRing.style.display = 'none';
    posLine.textContent = 'no position fix';
  }

  // Nav strip + button state.
  const st = t.nav_state || 'idle';
  navActive = ['acquiring', 'aligning', 'tracking', 'paused'].includes(st);
  if (!navBusy) {
    navBtn.textContent = navActive ? 'STOP PATH' : 'START PATH';
    navBtn.className = 'map-btn' + (navActive ? ' running' : '');
  }
  let detail = '';
  if (st === 'tracking') detail = ` · ${t.nav_progress_m}/${t.nav_total_m} m` +
      (t.nav_dist_to_goal_m != null ? ` · ${t.nav_dist_to_goal_m} m to go` : '');
  else if (t.nav_msg) detail = ` · ${t.nav_msg}`;
  navLine.innerHTML = `<span class="st ${st}">${st}</span>${detail}`;
}

// --- nav start/stop ---------------------------------------------------------
let toastTimer;
function toast(msg) {
  const el2 = document.getElementById('toast');
  el2.textContent = msg;
  el2.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el2.classList.remove('show'), 5000);
}

navBtn.addEventListener('click', async () => {
  if (navBusy) return;
  navBusy = true;
  navBtn.classList.add('busy');
  try {
    const r = await fetch(navActive ? '/api/nav/stop' : '/api/nav/start', {method: 'POST'});
    const body = await r.json();
    if (!r.ok) toast(body.error || `nav request failed (${r.status})`);
  } catch (e) {
    toast('nav request failed — no link to rover');
  } finally {
    navBusy = false;
    navBtn.classList.remove('busy');
    poll();
  }
});

// --- pan / zoom -------------------------------------------------------------
const pointers = new Map();
let panStart = null, pinchStart = null;

function toUser(e) {
  const r = svg.getBoundingClientRect();
  return {x: vb.x + (e.clientX - r.left) / r.width * vb.w,
          y: vb.y + (e.clientY - r.top) / r.height * vb.h};
}

svg.addEventListener('pointerdown', e => {
  svg.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, {x: e.clientX, y: e.clientY});
  if (pointers.size === 1) {
    panStart = {vb: {...vb}, x: e.clientX, y: e.clientY};
    svg.classList.add('dragging');
  } else if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    pinchStart = {vb: {...vb}, d: Math.hypot(a.x - b.x, a.y - b.y),
                  mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2};
    panStart = null;
  }
});
svg.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, {x: e.clientX, y: e.clientY});
  const r = svg.getBoundingClientRect();
  if (pointers.size === 1 && panStart) {
    vb.x = panStart.vb.x - (e.clientX - panStart.x) / r.width * panStart.vb.w;
    vb.y = panStart.vb.y - (e.clientY - panStart.y) / r.height * panStart.vb.h;
    applyVb();
  } else if (pointers.size === 2 && pinchStart) {
    const [a, b] = [...pointers.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    if (d < 10) return;
    const f = Math.min(Math.max(pinchStart.d / d, 0.05), 20);
    const w = Math.min(Math.max(pinchStart.vb.w * f, 24), meta.width_px * 1.5);
    const s = w / pinchStart.vb.w;
    const ux = pinchStart.vb.x + (pinchStart.mx - r.left) / r.width * pinchStart.vb.w;
    const uy = pinchStart.vb.y + (pinchStart.my - r.top) / r.height * pinchStart.vb.h;
    vb = {x: ux - (ux - pinchStart.vb.x) * s, y: uy - (uy - pinchStart.vb.y) * s,
          w, h: pinchStart.vb.h * s};
    applyVb();
  }
});
function endPointer(e) {
  pointers.delete(e.pointerId);
  if (pointers.size === 0) { panStart = pinchStart = null; svg.classList.remove('dragging'); }
  else if (pointers.size === 1) {
    const [a] = [...pointers.values()];
    panStart = {vb: {...vb}, x: a.x, y: a.y};
    pinchStart = null;
  }
}
svg.addEventListener('pointerup', endPointer);
svg.addEventListener('pointercancel', endPointer);
svg.addEventListener('wheel', e => {
  e.preventDefault();
  const u = toUser(e);
  zoomAt(u.x, u.y, e.deltaY > 0 ? 1.25 : 0.8);
}, {passive: false});

document.getElementById('zoom-in').addEventListener('click',
    () => zoomAt(vb.x + vb.w / 2, vb.y + vb.h / 2, 0.67));
document.getElementById('zoom-out').addEventListener('click',
    () => zoomAt(vb.x + vb.w / 2, vb.y + vb.h / 2, 1.5));
document.getElementById('zoom-fit').addEventListener('click', fit);
window.addEventListener('resize', applyVb);

init().catch(e => toast('map init failed: ' + e.message));
</script>
</body>
</html>
